<html lang="en">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'%3E%3Crect width='24' height='24' rx='5' fill='%23292D35'/%3E%3Cpath d='M12 4.5 4.5 8.25 12 12l7.5-3.75z' fill='%23FABE5D' stroke='%23FABE5D'/%3E%3Cpath d='M4.5 12 12 15.75 19.5 12' stroke='%23FFFFFF'/%3E%3Cpath d='M4.5 15.75 12 19.5l7.5-3.75' stroke='%23FFFFFF' opacity='.55'/%3E%3C/svg%3E" />
    <title>platform-kit bench</title>
    <script>
      // Apply the saved theme before the first paint, so that a dark choice
      // does not flash light while the app loads.
      try {
        var t = localStorage.getItem('pk.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
