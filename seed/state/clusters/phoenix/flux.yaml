# Flux objects of phoenix. Each Kustomization applies one path of the state repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: state
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea:3000/platform/state.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-metal
  namespace: flux-system
spec:
  interval: 10m
  path: ./control/inventory
  prune: true
  sourceRef:
    kind: GitRepository
    name: state
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/phoenix/infra/cilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: state
  decryption:
    provider: sops
    secretRef:
      name: sops-age
