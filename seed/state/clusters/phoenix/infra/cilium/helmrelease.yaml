apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cilium
      version: 1.18.2
      sourceRef: { kind: HelmRepository, name: cilium }
  values:
    kubeProxyReplacement: true
    k8sServiceHost: phoenix.k8s.pk.local
    k8sServicePort: 6443
    ipam:
      mode: kubernetes
    hubble:
      relay:
        enabled: true
