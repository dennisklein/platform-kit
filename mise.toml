# Toolchain and tasks for platform-kit. `mise install` puts every CLI on $PATH at a known
# version; `mise run <task>` (or `mise tasks` for the list) runs the build and test
# flows. https://mise.jdx.dev
#
# Pinning policy: the minor is pinned, the patch floats. Versions that must match a
# running system (Talos, Kubernetes) are noted next to their pin.

[tools]
go = "1.26"
# Talos 1.14 — the release the os.pk.io kinds render for (metal/go.mod pins machinery).
talosctl = "1.14"
# Kubernetes 1.36 — the k8s.io/* modules in metal/go.mod and the kind node image.
kubectl = "1.36"
kind = "0.32"
golangci-lint = "2"
jq = "1"
yq = "4"

[env]
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build the pk-metal CLI and the manager into metal/bin/"
dir = "metal"
# Stamped with the same tag the image gets, so `pk-metal version` on the workstation
# and the manager in the cluster can be compared.
run = '''
version=$(hack/image.sh tag)
CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/ ./cmd/pk-metal ./cmd/manager
'''

[tasks.image]
description = "Build the operator image (manager and pk-metal), tagged with the commit it was built from"
run = "metal/hack/image.sh build"

[tasks.test]
description = "Unit tests, and vet of the e2e build tag so the harness cannot rot"
dir = "metal"
run = ["go test ./...", "go vet -tags e2e ./test/e2e/"]

[tasks.fuzz]
description = "Run every Go fuzz target for FUZZTIME each (default 10s); a local search, not part of CI"
dir = "metal"
run = "hack/fuzz.sh"

[tasks.envtest]
description = "Controller tests against a real kube-apiserver and etcd"
dir = "metal"
# The suite skips when KUBEBUILDER_ASSETS is unset, and a skip reports ok. Resolve the
# path first and refuse an empty answer, so a failed download cannot read as a pass.
run = '''
assets=$(go tool setup-envtest use 1.36 --bin-dir "$PWD/bin/envtest" -p path)
[ -n "$assets" ] || { echo "envtest: no control-plane binaries resolved for k8s 1.36" >&2; exit 1; }
KUBEBUILDER_ASSETS="$assets" go test ./internal/envtest/
'''

[tasks."test:race"]
description = "Unit and controller tests under the race detector (needs cgo and a C compiler)"
dir = "metal"
# The relay, the media server's grants, the simulator and the Redfish client all run
# goroutines, and the reconcilers share their caches. The controller tests run here
# too, so the same refusal of an empty asset path applies.
run = '''
assets=$(go tool setup-envtest use 1.36 --bin-dir "$PWD/bin/envtest" -p path)
[ -n "$assets" ] || { echo "test:race: no control-plane binaries resolved for k8s 1.36" >&2; exit 1; }
CGO_ENABLED=1 KUBEBUILDER_ASSETS="$assets" go test -race ./...
'''

[tasks.lint]
description = "golangci-lint, the phase invariant and shellcheck"
depends = ["lint:go", "lint:phase", "lint:shell"]

[tasks."lint:shell"]
description = "bash -n and shellcheck over the hack scripts"
# shellcheck is a system package (apt-get install shellcheck); there is no mise pin for it.
run = '''
for script in metal/hack/*.sh; do
  bash -n "$script"
done
shellcheck --severity=warning metal/hack/*.sh
echo "lint:shell: clean"
'''

[tasks."lint:go"]
dir = "metal"
run = "golangci-lint run"

[tasks."lint:phase"]
description = "Only internal/phase writes .Status.Phase/.Status.BlockedOn, and reconcilers never read them (a typed check)"
dir = "metal"
# The check is a Go test: it loads the module with go/types, so it also sees writes
# through an alias, a pointer or a composite literal, in every package.
run = "go test -count=1 -run TestPhaseWriteSites ./internal/phase/"

[tasks.generate]
description = "Regenerate everything derived from the Go sources: deepcopy code, CRDs, RBAC"
dir = "metal"
run = [
  "go tool controller-gen object paths=./api/...",
  "go tool controller-gen crd paths=./api/... output:crd:artifacts:config=config/crd",
  "go run ./hack/reflowdesc config/crd/*_*.yaml",
  "hack/crd-kustomization.sh config/crd",
  # The manager's roles come from the +kubebuilder:rbac markers next to the code that
  # needs each permission: on the reconcilers, and in cmd/manager for leader election.
  "go tool controller-gen rbac:roleName=pk-metal-manager 'paths=./cmd/manager/...;./internal/controller/...' output:rbac:artifacts:config=config/rbac",
]

[tasks."generate:check"]
description = "Fail when a generated file is out of date with its source"
depends = ["generate"]
run = '''
drift=$(git status --porcelain -- metal/api metal/config)
if [ -n "$drift" ]; then
  echo "generate:check: generated files are out of date. Run 'mise run generate' and commit the result:" >&2
  echo "$drift" >&2
  git --no-pager diff --stat -- metal/api metal/config >&2
  exit 1
fi
echo "generate:check: clean"
'''

[tasks."sim:demo"]
description = "Curl walk over two generic simulated BMCs: service root, media, boot override, reset, task monitor"
dir = "metal"
run = "hack/sim-demo.sh"

[tasks."e2e:kind"]
description = "Kind tier: simulated BMC, a real Talos container, the full reconcile path"
dir = "metal"
run = "go test -tags e2e -count 1 -timeout 20m -run TestE2EKind -v ./test/e2e/"

[tasks."e2e:qemu"]
description = "VM tier: simulated BMC, a real UEFI VM, config over virtual media, a real install"
dir = "metal"
run = "go test -tags e2e -count 1 -timeout 40m -run TestE2EQemu -v ./test/e2e/"
