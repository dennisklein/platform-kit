# Toolchain and tasks for platform-kit. `mise install` puts every CLI on $PATH at a known
# version; `mise run <task>` (or `mise tasks` for the list) runs the build, test and lab
# flows. https://mise.jdx.dev
#
# Pinning policy: the minor is pinned, the patch floats. Versions that must match a
# running system (Talos, Kubernetes) are noted next to their pin.
#
# Not managed here (system packages): docker, qemu-system-x86_64, OVMF, iproute2,
# iptables. The virtual lab checks for them in `mise run lab:doctor`.

[tools]
go = "1.26"
# Talos 1.14 — the release the os.pk.io kinds render for (metal/go.mod pins machinery).
talosctl = "1.14"
# Kubernetes 1.36 — the k8s.io/* modules in metal/go.mod and the kind node image.
kubectl = "1.36"
kind = "0.32"
golangci-lint = "2"
jq = "1"
yq = "4"
# Node 24 LTS for the documentation site in docs/ (Astro + Starlight).
node = "24.22"
# Vale lints the documentation site against the STE style in docs/styles.
vale = "3.28"
# promtool checks and unit-tests the alerting rules (mise run metrics:rules).
promtool = "3"

[env]
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build the pk-metal CLI and the manager into metal/bin/"
dir = "metal"
# Stamped with the same tag the image gets, so `pk-metal version` on the workstation
# and the manager in the cluster can be compared.
run = '''
version=$(hack/image.sh tag)
CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/ ./cmd/pk-metal ./cmd/manager
'''

[tasks.image]
description = "Build the operator image (manager and pk-metal), tagged with the commit it was built from"
run = "metal/hack/image.sh build"

[tasks.test]
description = "Unit tests, and vet of the e2e build tag so the harness cannot rot"
dir = "metal"
run = ["go test ./...", "go vet -tags e2e ./test/e2e/"]

[tasks."metrics:rules"]
description = "promtool check and unit-test the alert rules in metal/config/prometheus (needs promtool on PATH)"
dir = "metal"
# promtool reads a plain rule file, not a PrometheusRule: the spec is copied out
# next to the tests, which name it rules.yaml.
run = '''
command -v promtool >/dev/null || { echo "metrics:rules: promtool is not on PATH; install it: mise install promtool" >&2; exit 1; }
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
yq '.spec' config/prometheus/rules.yaml > "$tmp/rules.yaml"
cp internal/metrics/testdata/rules_test.yaml "$tmp/"
promtool check rules "$tmp/rules.yaml"
promtool test rules "$tmp/rules_test.yaml"
'''

[tasks."test:hardware"]
description = "Read-only conformance checks against a real BMC: set PK_METAL_HW_URL and PK_METAL_BMC_PASSWORD"
dir = "metal"
run = '''
[ -n "${PK_METAL_HW_URL:-}" ] || { echo "test:hardware: set PK_METAL_HW_URL to the BMC, for example https://10.0.0.5" >&2; exit 1; }
go test -count 1 -run 'TestHardware$' -v ./internal/bmc/gofish/
'''

[tasks.fuzz]
description = "Run every Go fuzz target for FUZZTIME each (default 10s); a local search, not part of CI"
dir = "metal"
run = "hack/fuzz.sh"

[tasks.envtest]
description = "Controller tests against a real kube-apiserver and etcd"
dir = "metal"
# The suite skips when KUBEBUILDER_ASSETS is unset, and a skip reports ok. Resolve the
# path first and refuse an empty answer, so a failed download cannot read as a pass.
run = '''
assets=$(go tool setup-envtest use 1.36 --bin-dir "$PWD/bin/envtest" -p path)
[ -n "$assets" ] || { echo "envtest: no control-plane binaries resolved for k8s 1.36" >&2; exit 1; }
KUBEBUILDER_ASSETS="$assets" go test ./internal/envtest/
'''

[tasks."test:race"]
description = "Unit and controller tests under the race detector (needs cgo and a C compiler)"
dir = "metal"
# The relay, the media server's grants, the simulator and the Redfish client all run
# goroutines, and the reconcilers share their caches. The controller tests run here
# too, so the same refusal of an empty asset path applies.
run = '''
assets=$(go tool setup-envtest use 1.36 --bin-dir "$PWD/bin/envtest" -p path)
[ -n "$assets" ] || { echo "test:race: no control-plane binaries resolved for k8s 1.36" >&2; exit 1; }
CGO_ENABLED=1 KUBEBUILDER_ASSETS="$assets" go test -race ./...
'''

[tasks.lint]
description = "golangci-lint, the phase invariant and shellcheck"
depends = ["lint:go", "lint:phase", "lint:shell"]

[tasks."lint:shell"]
description = "bash -n and shellcheck over the lab and hack scripts"
# shellcheck is a system package (apt-get install shellcheck); there is no mise pin for it.
run = '''
for script in lab/*.sh metal/hack/*.sh; do
  bash -n "$script"
done
shellcheck --severity=warning lab/*.sh metal/hack/*.sh
echo "lint:shell: clean"
'''

[tasks."lint:go"]
dir = "metal"
run = "golangci-lint run"

[tasks."lint:phase"]
description = "Only internal/phase writes .Status.Phase/.Status.BlockedOn, and reconcilers never read them (a typed check)"
dir = "metal"
# The check is a Go test: it loads the module with go/types, so it also sees writes
# through an alias, a pointer or a composite literal, in every package.
run = "go test -count=1 -run TestPhaseWriteSites ./internal/phase/"

[tasks.generate]
description = "Regenerate everything derived from the Go sources: deepcopy code, CRDs, RBAC, the docs site data"
dir = "metal"
run = [
  "go tool controller-gen object paths=./api/...",
  "go tool controller-gen crd paths=./api/... output:crd:artifacts:config=config/crd",
  "go run ./hack/reflowdesc config/crd/*_*.yaml",
  "hack/crd-kustomization.sh config/crd",
  # The manager's roles come from the +kubebuilder:rbac markers next to the code that
  # needs each permission: on the reconcilers, and in cmd/manager for leader election.
  "go tool controller-gen rbac:roleName=pk-metal-manager 'paths=./cmd/manager/...;./internal/controller/...' output:rbac:artifacts:config=config/rbac",
  # The documentation site's reference data (CRD fields, pk-metal commands, RBAC,
  # actions, phases, conditions, keys), from the files generated above; it also
  # checks the glossary's shape.
  "go run ./hack/docgen",
]

[tasks."generate:check"]
description = "Fail when a generated file is out of date with its source"
depends = ["generate"]
run = '''
drift=$(git status --porcelain -- metal/api metal/config docs/src/data/generated)
if [ -n "$drift" ]; then
  echo "generate:check: generated files are out of date. Run 'mise run generate' and commit the result:" >&2
  echo "$drift" >&2
  git --no-pager diff --stat -- metal/api metal/config docs/src/data/generated >&2
  exit 1
fi
echo "generate:check: clean"
'''

[tasks."docs:gen"]
description = "Write the docs site's reference data (docs/src/data/generated) from the CRDs, RBAC, API and pk-metal help; also run by generate"
dir = "metal"
run = "go run ./hack/docgen"

[tasks."docs:lint:glossary"]
description = "Check the glossary definitions (docs/src/data/glossary.yaml) against the STE Vale style"
# Vale reads Markdown, not YAML: write each definition under its term as a
# heading into a scratch file, so a finding names the term it is in.
run = '''
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
yq -r '.terms[] | "## " + .term + "\n\n" + .def + "\n"' docs/src/data/glossary.yaml > "$tmp/glossary.md"
vale --config docs/.vale.ini "$tmp/glossary.md"
'''

[tasks."sim:demo"]
description = "Curl walk over two generic simulated BMCs: service root, media, boot override, reset, task monitor"
dir = "metal"
run = "hack/sim-demo.sh"

[tasks."e2e:kind"]
description = "Kind tier: simulated BMC, a real Talos container, the full reconcile path"
dir = "metal"
run = "go test -tags e2e -count 1 -timeout 20m -run TestE2EKind -v ./test/e2e/"

[tasks."e2e:qemu"]
description = "VM tier: simulated BMC, a real UEFI VM, config over virtual media, a real install"
dir = "metal"
run = "go test -tags e2e -count 1 -timeout 40m -run TestE2EQemu -v ./test/e2e/"

# The virtual lab (lab/README.md): a kind cluster running the operator, simulated BMCs
# driving QEMU machines, and a bridge between them. The flow lives in lab/lab.sh; the
# tasks exist so that it runs with the pinned tools on its PATH.

[tasks."lab:doctor"]
description = "Check the workstation for what the virtual lab needs; every miss names its fix"
run = "lab/lab.sh doctor"

[tasks."lab:render"]
description = "Render the lab from lab/lab.yaml (size: PK_LAB_NODES=3cp+2w) into .lab/generated; touches nothing else"
run = "lab/lab.sh render"

[tasks."lab:up"]
description = "Bring the virtual lab up: render lab/lab.yaml, network, kind, operator, simulated fleet, lab manifests"
depends = ["build"]
run = "lab/lab.sh up"

[tasks."lab:load"]
description = "Build the operator image, load it into the lab's kind cluster and roll the manager"
run = "lab/lab.sh deploy"

[tasks."lab:status"]
description = "The rack as the operator sees it, then every kind"
run = "lab/lab.sh status"

[tasks."lab:top"]
description = "Live view of the lab: each machine's BMC, VM, operation and node; keys approve, hold and retry"
depends = ["build"]
# The fleet serves its state on loopback (pk-metal sim fleet --state-listen). The
# workload cluster's kubeconfig exists once lab:kubeconfig ran; top shows the
# kubelets' Ready state only then.
run = '''
lab=${PK_LAB_DIR:-.lab}
[ -s "$lab/kubeconfig" ] || { echo "lab:top: $lab/kubeconfig is missing. Bring the lab up: mise run lab:up" >&2; exit 1; }
set -- --kubeconfig "$lab/kubeconfig" top --fleet http://127.0.0.1:8440/state
[ -s "$lab/workload.kubeconfig" ] && set -- "$@" --workload-kubeconfig "$lab/workload.kubeconfig"
exec metal/bin/pk-metal "$@"
'''

[tasks."lab:approve"]
description = "Approve every operation that waits for a person"
run = "lab/lab.sh approve"

[tasks."lab:apply"]
description = "Apply manifests as a member of the admin group the claim policy asks for (default: the rendered lab manifests)"
run = "lab/lab.sh apply"

[tasks."lab:kubeconfig"]
description = "Write the workload cluster's kubeconfig and talosconfig to .lab/"
run = "lab/lab.sh kubeconfig"

[tasks."lab:wait"]
description = "Unattended: approve what is proposed and wait until every host is Provisioned and every node Ready"
run = "lab/lab.sh wait"

[tasks."lab:release"]
description = "Unattended: delete a claim (namespace/name), approve its shutdown and wait until its Host is Available"
run = "lab/lab.sh release"

[tasks."lab:day2"]
description = "Unattended, on a converged lab: reboot a worker and a control plane with pk-metal reboot, approved by a second user, then roll a node label (no reboot) through an approved Config rollout"
depends = ["build"]
run = "lab/lab.sh day2"

[tasks."lab:upgrade"]
description = "Unattended day 2: upgrade a lab brought up on an older Talos (PK_LAB_TALOS=v1.14.5) to the spec's release through an approved rollout"
depends = ["build"]
run = "lab/lab.sh upgrade"

[tasks."lab:scale"]
description = "Unattended day 2 on a 3cp+2w lab: control planes 3 -> 1 -> 3, remove a worker, replace a control plane, back to 1"
depends = ["build"]
run = "lab/lab.sh scale"

[tasks."lab:backup-restore"]
description = "Unattended day 2: back up the first cluster's etcd, wipe it on every control plane, and restore it through pk-metal restore"
depends = ["build"]
run = "lab/lab.sh backup-restore"

[tasks."lab:observe"]
description = "On a converged lab: check the CLUSTER/NODE tables of pk-metal status, the operator's metrics, and a maintenance window holding an approved operation until it opens"
run = "lab/lab.sh observe"

[tasks."lab:pivot"]
description = "Unattended: move the operator from kind onto the first Talos cluster, delete kind, and install the second cluster (PK_LAB_WORKLOAD) from there"
depends = ["build"]
run = "lab/lab.sh pivot"

[tasks."lab:collect"]
description = "Write logs and object dumps of the lab to .lab/diagnostics"
run = "lab/lab.sh collect"

[tasks."lab:down"]
description = "Stop the fleet, delete the kind cluster, remove the lab network; keeps disks and caches"
run = "lab/lab.sh down"

[tasks."lab:reset"]
description = "Wipe the lab machines' disks (the lab must be down)"
run = "lab/lab.sh reset"

# Documentation site (docs/): Astro + Starlight. The site deploys to GitHub Pages from
# the metal branch (.github/workflows/docs.yml).

[tasks."docs:install"]
description = "Install the pinned npm packages of the documentation site (npm ci)"
dir = "docs"
run = "npm ci --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."docs:dev"]
description = "Serve the documentation site with live reload at http://localhost:4321/platform-kit/"
dir = "docs"
depends = ["docs:install"]
env = { ASTRO_TELEMETRY_DISABLED = "1" }
run = "npx astro dev"

[tasks."docs:build"]
description = "Build the documentation site into docs/dist; fails on an unknown category link or a broken internal link"
dir = "docs"
depends = ["docs:install"]
env = { ASTRO_TELEMETRY_DISABLED = "1" }
run = "npx astro build"

[tasks."docs:preview"]
description = "Serve the built site from docs/dist"
dir = "docs"
env = { ASTRO_TELEMETRY_DISABLED = "1" }
run = "npx astro preview"

[tasks."docs:links"]
description = "Check the category links and their anchors in docs/dist, and the pages for links hidden in SVG images and for duplicate ids"
dir = "docs"
depends = ["docs:build"]
run = ["node scripts/check-xrefs.mjs dist", "node scripts/check-html.mjs dist"]

[tasks."docs:check"]
description = "The documentation gate of CI: build, internal links, category links, the STE lint of the pages and the glossary (errors fail), theme contrast, the actions page against the API"
depends = ["docs:links", "docs:lint", "docs:lint:glossary", "docs:lint:contrast", "docs:lint:actions"]

[tasks."docs:shots"]
description = "Take screenshots of representative pages (light, dark, phone) into docs/.shots (needs Playwright with Chromium; set NODE_PATH to it)"
dir = "docs"
depends = ["docs:build"]
env = { ASTRO_TELEMETRY_DISABLED = "1" }
run = "node scripts/shots.mjs"

[tasks."docs:lint:generated"]
description = "Check the generated reference text (Go doc comments, command help) with the STE Vale style; reports only, does not fail yet"
dir = "docs"
# The text comes from metal/api and metal/cmd: fix a finding there, then run docs:gen.
# Warnings only for now: the text has long sentences that the owners of the Go
# files rewrite step by step. Make it fail (drop --no-exit) when the count is 0.
run = '''
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
node scripts/generated-text.mjs "$tmp"
vale --config .vale.ini --no-exit "$tmp"
'''

[tasks."docs:lint:actions"]
description = "Check that the actions page (reference/actions.mdx) has each action and field of the API (docs/src/data/generated/actions.json)"
dir = "docs"
depends = ["docs:install"]
run = "node scripts/check-actions.mjs"

[tasks."docs:lint:contrast"]
description = "Check the WCAG contrast of the theme colors (docs/src/styles/theme.css): 4.5:1 for text, 3:1 for diagram lines"
dir = "docs"
run = "node scripts/check-contrast.mjs"

[tasks."docs:lint"]
description = "Check the prose of the documentation pages with the STE Vale style (docs/.vale.ini)"
dir = "docs"
run = "vale --config .vale.ini src/content/docs"
