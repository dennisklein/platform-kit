<title>Change Rail Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: bench top bar, left rail of open changes (grouped, stacks indented), right detail with lifecycle track, gates, metadata and merge preview. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --ink: #18202a; --muted: #5b6878; --line: #dde3ea;
  --accent: #2f5bd3; --accent-soft: #e6ecfb;
  --ok: #1f7a4d; --ok-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fbf0d9; --bad: #b3261e; --bad-soft: #fbe6e4; --idle: #8a96a6;
  --sans: "Instrument Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --panel: #181e26; --ink: #e4e9ef; --muted: #96a2b2; --line: #2a333e;
  --accent: #86a5ff; --accent-soft: #1e2a47;
  --ok: #5fcf96; --ok-soft: #173326; --warn: #e8b350; --warn-soft: #3a2c10; --bad: #ff8a80; --bad-soft: #3d1c1a; --idle: #6c7888; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #181e26; --ink: #e4e9ef; --muted: #96a2b2; --line: #2a333e;
  --accent: #86a5ff; --accent-soft: #1e2a47;
  --ok: #5fcf96; --ok-soft: #173326; --warn: #e8b350; --warn-soft: #3a2c10; --bad: #ff8a80; --bad-soft: #3d1c1a; --idle: #6c7888; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
.note { color: var(--muted); font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.brand { font-weight: 700; letter-spacing: .01em; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.spacer { flex: 1; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 11px; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.btn:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }
.rail, .detail section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.rail { padding: 8px; display: grid; gap: 2px; }
.rail-tools { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 6px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.chip-f { font-size: 12px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.chip-f[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 8px 4px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; width: 100%; border: 0; background: transparent; color: inherit; border-radius: 6px; padding: 8px; }
.item:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item.child { padding-left: 26px; position: relative; }
.item.child::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 50%; width: 8px; border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); border-bottom-left-radius: 5px; }
.item .title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
.state { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 4px; white-space: nowrap; align-self: start; }
.s-draft { background: var(--line); color: var(--muted); }
.s-lab { background: var(--warn-soft); color: var(--warn); }
.s-labfail { background: var(--bad-soft); color: var(--bad); }
.s-review, .s-approved { background: var(--accent-soft); color: var(--accent); }
.s-merged, .s-deployed, .s-verified { background: var(--ok-soft); color: var(--ok); }
.behind { color: var(--warn); font-weight: 600; }
.detail { display: grid; gap: 14px; min-width: 0; }
.detail section { padding: 14px 16px; min-width: 0; }
.detail h2 { font-size: 17px; margin: 0; text-wrap: balance; }
.detail h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.meta-row { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; overflow-x: auto; }
.step { position: relative; padding-top: 22px; min-width: 88px; }
.step::before { content: ""; position: absolute; top: 7px; left: 0; right: 0; height: 2px; background: var(--line); }
.step:first-child::before { left: 50%; } .step:last-child::before { right: 50%; }
.step.done::before { background: var(--ok); }
.step .node { position: absolute; top: 0; left: 50%; translate: -50% 0; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); border: 2px solid var(--idle); }
.step.done .node { background: var(--ok); border-color: var(--ok); }
.step.now .node { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.fail .node { border-color: var(--bad); background: var(--bad); }
.step .lbl { text-align: center; font-weight: 600; font-size: 13px; }
.step .src { text-align: center; font-size: 11px; color: var(--muted); padding: 0 4px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.gates { display: grid; gap: 8px; }
.gate { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; }
.gate .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--panel); }
.ic.ok { background: var(--ok); } .ic.bad { background: var(--bad); } .ic.wait { background: var(--idle); }
.gate small { display: block; color: var(--muted); }
pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 12px/1.5 var(--mono); }
.k { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.stack { display: grid; gap: 6px; }
.stack .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
</style>

<div class="wrap">
  <p class="note">Mock for the change model in docs/design.html. Example data from the raven lab system. Click a change in the rail.</p>

  <header class="bar">
    <span class="brand">platform-kit</span>
    <span class="pill">bench · local mode</span>
    <span class="pill ok"><span class="dot"></span>GitLab reachable</span>
    <span class="pill ok"><span class="dot"></span>LLM online</span>
    <span class="pill warn"><span class="dot"></span>main moved 2 min ago</span>
    <span class="spacer"></span>
    <button class="btn primary" id="new-change" type="button">New change</button>
  </header>

  <div class="main">
    <nav class="rail" aria-label="Open changes">
      <div class="rail-tools" role="group" aria-label="Filter">
        <button class="chip-f" type="button" aria-pressed="true" data-f="all" id="f-all">All open</button>
        <button class="chip-f" type="button" aria-pressed="false" data-f="mine" id="f-mine">Mine</button>
        <button class="chip-f" type="button" aria-pressed="false" data-f="review" id="f-review">Needs my review</button>
        <button class="chip-f" type="button" aria-pressed="false" data-f="bot" id="f-bot">Bots</button>
      </div>
      <div id="rail"></div>
    </nav>

    <div class="detail" id="detail"></div>
  </div>

  <section style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px">
    <h3 style="font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px">State chips</h3>
    <div class="legend">
      <span class="state s-draft">draft</span><span class="state s-lab">lab running</span><span class="state s-labfail">lab failed</span>
      <span class="state s-review">review</span><span class="state s-approved">approved</span><span class="state s-merged">merged</span>
      <span class="state s-deployed">deployed</span><span class="state s-verified">verified</span>
    </div>
  </section>
</div>

<script>
const STEPS = [
  ["draft", "worktree / branch"], ["lab", "lab runs"], ["review", "MR ready"], ["approved", "MR approvals"],
  ["merged", "main + trailer"], ["deployed", "Flux"], ["verified", "health checks"]
];
const CHANGES = [
  { id: "c-31d0", slug: "cabling-b12", title: "Add cabling for rack B12", state: "approved", author: "dennis", agent: null, group: "mine",
    behind: 3, parent: null, paths: ["control/inventory/cabling.yaml"], lab: "pass", labRun: "run-2", approvals: "1 of 1", mr: "!121",
    intent: "Cable plan for the new rack B12 before nodes are added." },
  { id: "c-4f2a", slug: "rack-b12", title: "Add rack B12 workers to raven", state: "lab", author: "dennis", agent: "dennis/agent", group: "mine",
    behind: 3, parent: "c-31d0", paths: ["control/inventory/worker006.yaml", "control/inventory/worker007.yaml", "control/talos/talconfig.yaml"], lab: "running", labRun: "run-3", approvals: "0 of 2", mr: "!123",
    intent: "Add 8 worker nodes in rack B12 for batch jobs." },
  { id: "c-77e1", slug: "cilium-bgp-peers", title: "Add BGP peers for router1 and router2", state: "labfail", author: "anna", agent: null, group: "shared",
    behind: 0, parent: null, paths: ["control/platform/configs/cilium-bgp.yaml"], lab: "fail", labRun: "run-1", approvals: "0 of 2", mr: "!119",
    intent: "Peer Cilium BGP with both routers for LoadBalancer IPs." },
  { id: "c-0b9c", slug: "vault-docs-bump", title: "Bump vault-docs site image", state: "review", author: "jonas", agent: null, group: "review",
    behind: 0, parent: null, paths: ["control/apps/vault-docs/deployment.yaml"], lab: "n/a", labRun: null, approvals: "0 of 1", mr: "!124",
    intent: "Roll the vault guide site to the new build." },
  { id: "c-a5e3", slug: "org-sync-serials", title: "Sync serials from asset DB", state: "draft", author: "sync-bot", agent: null, group: "bot",
    behind: 0, parent: null, paths: ["control/inventory/infra02.yaml", "control/inventory/worker003.yaml"], lab: "n/a", labRun: null, approvals: "0 of 1", mr: "!125 (draft)",
    intent: "Nightly import: 2 serial numbers differ from the asset DB (asset DB owns the field)." },
  { id: "c-19f4", slug: "controller-kernel-args", title: "Set kernel args on controllers", state: "deployed", author: "dennis", agent: null, group: "mine",
    behind: 0, parent: null, paths: ["control/talos/patches/controller.yaml"], lab: "pass", labRun: "run-4", approvals: "2 of 2", mr: "!117",
    intent: "Enable IOMMU on controller1 to controller3." }
];
const LABEL = { draft: "draft", lab: "lab running", labfail: "lab failed", review: "review", approved: "approved", merged: "merged", deployed: "deployed", verified: "verified" };
const GROUPS = [["mine", "My changes"], ["shared", "Pushed by others"], ["review", "Waiting for my review"], ["bot", "Bot changes"]];
let current = "c-4f2a", filter = "all";

function stepIndex(s) { return s === "labfail" ? 1 : STEPS.findIndex(x => x[0] === s); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderRail() {
  const rail = document.getElementById("rail");
  let html = "";
  for (const [g, name] of GROUPS) {
    if (filter !== "all" && filter !== g) continue;
    const list = CHANGES.filter(c => c.group === g);
    if (!list.length) continue;
    html += `<div class="group">${name}</div>`;
    const ordered = [];
    list.filter(c => !c.parent).forEach(p => { ordered.push(p); list.filter(c => c.parent === p.id).forEach(k => ordered.push(k)); });
    list.filter(c => c.parent && !list.some(p => p.id === c.parent)).forEach(c => ordered.push(c));
    for (const c of ordered) {
      html += `<button class="item${c.parent ? " child" : ""}" type="button" id="i-${c.id}" data-id="${c.id}" aria-current="${c.id === current}">
        <span class="title">${esc(c.title)}</span><span class="state s-${c.state}">${LABEL[c.state]}</span>
        <span class="sub"><span class="mono">${c.id}</span><span>${esc(c.agent ? c.author + " + agent" : c.author)}</span>
        ${c.behind ? `<span class="behind">behind main by ${c.behind}</span>` : ""}${c.parent ? `<span>stacked on ${c.parent}</span>` : ""}</span>
      </button>`;
    }
  }
  rail.innerHTML = html;
  rail.querySelectorAll(".item").forEach(b => b.addEventListener("click", () => { current = b.dataset.id; renderRail(); renderDetail(); }));
}

function renderDetail() {
  const c = CHANGES.find(x => x.id === current);
  const idx = stepIndex(c.state);
  const steps = STEPS.map(([k, src], i) => {
    let cls = i < idx ? "done" : i === idx ? (c.state === "labfail" ? "fail" : "now") : "";
    if (c.state === "deployed" && i <= idx) cls = "done";
    return `<div class="step ${cls}"><span class="node"></span><div class="lbl">${k}</div><div class="src">${src}</div></div>`;
  }).join("");
  const labGate = c.paths.some(p => p.includes("talos") || p.includes("inventory") || p.includes("cilium"));
  const gates = [
    labGate ? [c.lab === "pass" ? "ok" : c.lab === "fail" ? "bad" : "wait", "Green lab run on branch head", `policy: lab required for control/talos/**, control/inventory/**, network · ${c.labRun || "no run"}`]
            : ["ok", "No lab needed", "policy: control/apps/** has no lab gate"],
    [c.approvals.startsWith(c.approvals.split(" of ")[1]) ? "ok" : "wait", `Approvals ${c.approvals}`, "policy: 2 approvals for control/talos/**, 1 for others"],
    [c.behind ? "wait" : "ok", c.behind ? `Behind main by ${c.behind}` : "Up to date with target", c.parent ? `target: change/${c.parent}` : "target: main"],
    [c.state === "draft" || c.state === "lab" || c.state === "labfail" ? "wait" : "ok", "Metadata file moved to MR description", "done when the change moves to review"]
  ].map(([s, t, d]) => `<div class="gate"><span class="ic ${s}">${s === "ok" ? "✓" : s === "bad" ? "✕" : "·"}</span><div>${esc(t)}<small>${esc(d)}</small></div></div>`).join("");
  const kids = CHANGES.filter(x => x.parent === c.id);
  const stack = c.parent || kids.length ? `<section><h3>Stack</h3><div class="stack">
      <div class="row"><span class="mono">main</span></div>
      ${(c.parent ? [CHANGES.find(x => x.id === c.parent), c] : [c, ...kids]).map((x, i) => `<div class="row" style="padding-left:${(i + 1) * 16}px">└ <span class="mono">${x.id}</span> ${esc(x.title)} <span class="state s-${x.state}">${LABEL[x.state]}</span></div>`).join("")}
      <div class="actions"><button class="btn" type="button" id="rebase-stack">Rebase full stack</button></div></div></section>` : "";
  document.getElementById("detail").innerHTML = `
    <section>
      <div class="head"><h2>${esc(c.title)}</h2><span class="state s-${c.state}">${LABEL[c.state]}</span></div>
      <div class="meta-row"><span class="mono">change/${c.id}-${c.slug}</span><span>MR ${c.mr}</span><span>author ${esc(c.author)}${c.agent ? ` · agent ${esc(c.agent)}` : ""}</span><span>${c.paths.length} files</span></div>
      <div class="actions" style="margin-top:12px">
        ${c.behind ? `<button class="btn" type="button" id="rebase">Rebase on ${c.parent ? c.parent : "main"} (${c.behind})</button>` : ""}
        <button class="btn" type="button" id="run-lab">Run lab</button>
        <button class="btn" type="button" id="advise">Ask advisor: risks of this change</button>
        <button class="btn" type="button" id="open-wt">Open worktree</button>
      </div>
    </section>
    <section><h3>Lifecycle · derived, not stored</h3><div class="track">${steps}</div></section>
    ${stack}
    <div class="cols">
      <section><h3>Gates from .pk/policy.yaml</h3><div class="gates">${gates}</div></section>
      <section><h3>Changed paths</h3><pre>${c.paths.map(esc).join("\n")}</pre></section>
    </div>
    <div class="cols">
      <section><h3>.pk/changes/${c.id}.yaml (in branch)</h3><pre><span class="k">id:</span> ${c.id}
<span class="k">title:</span> ${esc(c.title)}
<span class="k">intent:</span> ${esc(c.intent)}
<span class="k">parent:</span> ${c.parent || "null"}
<span class="k">labRuns:</span>${c.labRun ? `\n  - ${c.id}/${c.labRun} ${c.lab}` : " []"}</pre></section>
      <section><h3>Merge commit preview (trailers)</h3><pre>Merge change ${c.id}: ${esc(c.title)} (${c.mr.split(" ")[0]})

<span class="k">Pk-Change:</span> ${c.id}
<span class="k">Pk-Intent:</span> ${esc(c.intent)}${c.parent ? `\n<span class="k">Pk-Stack-Parent:</span> ${c.parent}` : ""}${c.labRun ? `\n<span class="k">Pk-Lab-Run:</span> ${c.id}/${c.labRun} ${c.lab}` : ""}
<span class="k">Pk-Author:</span> ${esc(c.author)}${c.agent ? `\n<span class="k">Pk-Agent:</span> ${esc(c.agent)}` : ""}
<span class="k">Approved-by:</span> (from GitLab at merge)</pre></section>
    </div>`;
}

document.querySelectorAll(".chip-f").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip-f").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  const visible = CHANGES.filter(c => filter === "all" || c.group === filter);
  if (visible.length && !visible.some(c => c.id === current)) current = visible[0].id;
  renderRail(); renderDetail();
}));
renderRail(); renderDetail();
</script>
