# Vale checks the site's prose against a digest of ASD-STE100 (Simplified
# Technical English). The rules are in styles/STE; the project's word list is
# styles/config/vocabularies/Metal. Code blocks, inline code, frontmatter and
# MDX/JSX attributes are not checked (styles/STE/Spelling.yml).
#
#   mise run docs:lint            the pages (fails on an error)
#   mise run docs:lint:glossary   the glossary definitions
#
# Levels: error = breaks an STE rule that has no exception here (the lint
# fails); warning = usually wrong, but has real exceptions (shown in the log);
# suggestion = a hint for the writer.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Metal

[*.{md,mdx}]
BasedOnStyles = Vale, STE
# STE.Spelling replaces Vale.Spelling: the same check, without the frontmatter.
# The STE rules skip the frontmatter too (scope ~text.frontmatter).
Vale.Spelling = NO
# Vale.Terms enforces the case of the word list (Talos, not talos). A
# sentence that starts with a lower-case name is correct, so warn only.
Vale.Terms = warning
# Procedure pages get the shorter limit in the section below.
STE.ProcedureSentenceLength = NO

# Procedures: tutorials, how-tos and runbooks (STE rule 5.1: at most 20 words).
[**/{learn,operate}/**/*.{md,mdx}]
STE.ProcedureSentenceLength = YES
