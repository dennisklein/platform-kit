---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pk-metal-manager
rules:
- apiGroups:
  - metal.pk.io
  resources:
  - hostoperations
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pk-metal-manager
  namespace: pk-metal
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
