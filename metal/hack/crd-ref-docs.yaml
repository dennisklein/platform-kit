# Field reference generation: `mise run generate` writes docs/metal/api.md from the
# API godoc and nothing else, so the page cannot disagree with the types. Status
# subresources are the operator's read surface, so they stay: a reader needs to
# see the conditions a controller writes.
processor:
  # List wrappers carry no user-facing fields of their own; every kind here has
  # one and none are worth a section.
  ignoreTypes:
    - "List$"
  ignoreFields:
    - "TypeMeta$"

render:
  kubernetesVersion: 1.36
