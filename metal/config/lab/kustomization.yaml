# The operator as the virtual lab runs it (lab/README.md). `mise run lab:up` does
# not apply this directory directly: it generates .lab/deploy/, a kustomization
# on top of this one that adds the three things only known at run time, which
# are the image tag just built, the ledger rendered from lab/lab.yaml, and the
# Talos secrets bundle generated on the workstation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
  - admins.yaml
  - metrics_reader.yaml
# The lab can install a machine behind a one-slot BMC, which needs the media
# store (lab/README.md).
components:
  - ../media-store
patches:
  - path: approval.yaml
  - path: networkpolicy.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: pk-metal-manager
  - path: manager_args.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: pk-metal-manager
