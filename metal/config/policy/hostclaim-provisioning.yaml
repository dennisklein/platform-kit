# Who may point a claim at an OS and who may waive its boot approval. A claim that
# names a TalosNode makes the operator mount that node's rendered config on the
# machine — a control-plane config carries the cluster's CA keys — and
# provisioning.approval: Automatic lets the operator boot it without a person. Both
# are therefore an admin's decision, not any claim author's:
#   - only a member of the admin group sets or changes spec.os.nodeRef;
#   - only a member of the admin group turns provisioning.approval to Automatic;
#   - only a member of the admin group points a claim at another machine
#     (spec.assetRef or spec.systemRef, pk-metal replace): the operator releases
#     the machine the claim holds and installs its node on the new one.
# Everything else on a claim stays open to its authors. Unchanged values pass on
# UPDATE, so the operator's own writes (finalizers) and edits to other fields never
# need the group.
#
# The admin group comes from the same parameters as the HostOperation approval
# policy (hostoperation-approval.yaml); a missing ConfigMap denies every create and
# update of a claim: the gate fails closed.
#
# CEL note: oldObject is null on CREATE — every reference to it sits behind a
# lazily-evaluated request.operation ternary (the null-oldObject guard).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hostclaim-provisioning
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["metal.pk.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["hostclaims"]
  variables:
    - name: newNode
      expression: "has(object.spec.os) ? object.spec.os.nodeRef.name : ''"
    - name: oldNode
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.spec.os)
        ? oldObject.spec.os.nodeRef.name : ''
    - name: newAutomatic
      expression: >-
        has(object.spec.provisioning) && has(object.spec.provisioning.approval)
        && object.spec.provisioning.approval == 'Automatic'
    - name: oldAutomatic
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.spec.provisioning)
        && has(oldObject.spec.provisioning.approval)
        && oldObject.spec.provisioning.approval == 'Automatic'
    - name: retarget
      expression: >-
        request.operation == 'UPDATE'
        ? (object.spec.assetRef.name != oldObject.spec.assetRef.name
          || (has(object.spec.systemRef) ? object.spec.systemRef.name : '')
            != (has(oldObject.spec.systemRef) ? oldObject.spec.systemRef.name : ''))
        : false
    - name: isAdmin
      expression: >-
        has(params.data) && has(params.data.adminGroup) && params.data.adminGroup != ''
        && has(request.userInfo.groups) && params.data.adminGroup in request.userInfo.groups
    # The second half of every refusal: who the request came from and how to
    # get into the group. Being cluster-admin (system:masters) is not enough,
    # the policy asks for the group by name.
    - name: howToJoin
      expression: >-
        '; you are ' + request.userInfo.username + ' (groups: '
        + (has(request.userInfo.groups) ? request.userInfo.groups.join(', ') : 'none')
        + '). Bind your admins to the group ' + params.data.adminGroup
        + ' (a ClusterRoleBinding to the group, or a group from your identity provider).'
        + ' In the virtual lab, apply as a member: mise run lab:apply <file>'
  validations:
    - expression: "variables.newNode == '' || variables.newNode == variables.oldNode || variables.isAdmin"
      messageExpression: >-
        'only an admin (group ' + params.data.adminGroup + ') may name the TalosNode a claim boots'
        + ' (spec.os installs that OS onto the machine)' + variables.howToJoin
      reason: Forbidden
    - expression: "!variables.newAutomatic || variables.oldAutomatic || variables.isAdmin"
      messageExpression: >-
        'only an admin (group ' + params.data.adminGroup + ') may waive provisioning approval'
        + variables.howToJoin
      reason: Forbidden
    - expression: "!variables.retarget || variables.isAdmin"
      messageExpression: >-
        'only an admin (group ' + params.data.adminGroup + ') may point a claim at another machine'
        + ' (the machine it holds is released and its node installed on the new one: pk-metal replace)'
        + variables.howToJoin
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hostclaim-provisioning
spec:
  policyName: hostclaim-provisioning
  validationActions: ["Deny"]
  paramRef:
    name: hostoperation-approval
    namespace: pk-metal
    parameterNotFoundAction: Deny
