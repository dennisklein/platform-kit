# Who may change what pk-metal writes to the BMCs. An EndpointProfile has no
# operation gate: the operator applies it to every ManagementEndpoint it
# selects. It creates an Administrator account on each BMC (credentials), sets
# its time sources (ntp), and replaces its HTTPS identity with a certificate
# from the issuer it names (tls), which restarts the BMC. Merging a profile is
# the approval, so it is an admin's decision:
#   - only a member of the admin group creates an EndpointProfile or changes
#     its spec.
# Unchanged values pass on UPDATE, so the operator's own writes (finalizers,
# status) and label or annotation edits never need the group.
#
# The admin group comes from the same parameters as the HostOperation approval
# policy (hostoperation-approval.yaml); a missing ConfigMap denies every create
# and update of a profile: the gate fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: endpointprofile-guard
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["metal.pk.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["endpointprofiles"]
  variables:
    - name: specChanged
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
    - name: isAdmin
      expression: >-
        has(params.data) && has(params.data.adminGroup) && params.data.adminGroup != ''
        && has(request.userInfo.groups) && params.data.adminGroup in request.userInfo.groups
    - name: howToJoin
      expression: >-
        '; you are ' + request.userInfo.username + ' (groups: '
        + (has(request.userInfo.groups) ? request.userInfo.groups.join(', ') : 'none')
        + '). Group membership comes from your credential, not from a binding:'
        + ' the O= of your client certificate, a groups claim of your OIDC provider,'
        + ' or --as-group when you impersonate.'
  validations:
    - expression: "!variables.specChanged || variables.isAdmin"
      messageExpression: >-
        'only an admin (group ' + params.data.adminGroup + ') may create or change an EndpointProfile'
        + ' (it sets the account, time sources and TLS identity of every BMC it selects)'
        + variables.howToJoin
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: endpointprofile-guard
spec:
  policyName: endpointprofile-guard
  validationActions: ["Deny"]
  paramRef:
    name: hostoperation-approval
    namespace: pk-metal
    parameterNotFoundAction: Deny
