# Who may lengthen the life of a cluster's published admin credentials.
# spec.credentials.ttl of a TalosCluster sets how long the admin kubeconfig
# and the admin talosconfig that the operator publishes stay valid. A copy
# of one cannot be revoked short of a CA rotation, so the ttl bounds a
# leaked copy. The CRD caps it at 720h for everyone; this policy caps it at
# 24h (the default) for everyone but the admin group:
#   - only a member of the admin group sets spec.credentials.ttl to more
#     than 24h, on a create or an update.
# Unchanged values pass on UPDATE, so the operator's own writes and every
# other edit of the cluster (pk-metal-oncall and pk-metal-approver may patch
# it) never need the group. Anybody who may patch the cluster may shorten
# the ttl or remove it.
#
# The admin group comes from the same parameters as the HostOperation approval
# policy (hostoperation-approval.yaml); a missing ConfigMap denies every create
# and update of a TalosCluster: the gate fails closed.
#
# CEL note: oldObject is null on CREATE; every reference to it sits behind a
# lazily-evaluated request.operation ternary (the null-oldObject guard).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: taloscluster-credentials-guard
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["os.pk.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["talosclusters"]
  variables:
    - name: newTTL
      expression: "duration(object.spec.?credentials.?ttl.orValue('24h'))"
    - name: oldTTL
      expression: >-
        request.operation == 'UPDATE'
        ? duration(oldObject.spec.?credentials.?ttl.orValue('24h')) : duration('24h')
    - name: stretched
      expression: "variables.newTTL > duration('24h') && variables.newTTL != variables.oldTTL"
    - name: isAdmin
      expression: >-
        has(params.data) && has(params.data.adminGroup) && params.data.adminGroup != ''
        && has(request.userInfo.groups) && params.data.adminGroup in request.userInfo.groups
    - name: howToJoin
      expression: >-
        '; you are ' + request.userInfo.username + ' (groups: '
        + (has(request.userInfo.groups) ? request.userInfo.groups.join(', ') : 'none')
        + '). Group membership comes from your credential, not from a binding:'
        + ' the O= of your client certificate, a groups claim of your OIDC provider,'
        + ' or --as-group when you impersonate.'
  validations:
    - expression: "!variables.stretched || variables.isAdmin"
      messageExpression: >-
        'only an admin (group ' + params.data.adminGroup + ') may set spec.credentials.ttl above 24h'
        + ' (a published admin credential stays valid that long and cannot be revoked)'
        + variables.howToJoin
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: taloscluster-credentials-guard
spec:
  policyName: taloscluster-credentials-guard
  validationActions: ["Deny"]
  paramRef:
    name: hostoperation-approval
    namespace: pk-metal
    parameterNotFoundAction: Deny
