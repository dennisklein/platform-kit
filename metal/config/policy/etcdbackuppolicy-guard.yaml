# Who may decide where etcd backups go and who can read them. A snapshot holds
# every Secret of the cluster. Its age recipients decide who can decrypt it,
# and its sink (and the credentials and CA the sink names) decides where the
# ciphertext goes. A person who adds their own recipient reads every later
# snapshot. So both are an admin's decision, not any policy author's:
#   - only a member of the admin group creates an EtcdBackupPolicy;
#   - only a member of the admin group changes spec.encryption (the
#     recipients) or spec.sink (s3 endpoint, bucket, credentialsSecretRef,
#     caSecretRef, or pvc).
# The rest of a policy (interval, retention, suspend) stays open to its
# authors. Unchanged values pass on UPDATE, so the operator's own writes
# (finalizers, status) never need the group.
#
# The admin group comes from the same parameters as the HostOperation approval
# policy (hostoperation-approval.yaml); a missing ConfigMap denies every create
# and update of a policy: the gate fails closed.
#
# CEL note: oldObject is null on CREATE — every reference to it sits behind a
# lazily-evaluated request.operation ternary (the null-oldObject guard).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: etcdbackuppolicy-guard
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["os.pk.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["etcdbackuppolicies"]
  variables:
    - name: readersOrPlaceChanged
      expression: >-
        request.operation == 'CREATE'
        || object.spec.encryption != oldObject.spec.encryption
        || object.spec.sink != oldObject.spec.sink
    - name: isAdmin
      expression: >-
        has(params.data) && has(params.data.adminGroup) && params.data.adminGroup != ''
        && has(request.userInfo.groups) && params.data.adminGroup in request.userInfo.groups
    - name: howToJoin
      expression: >-
        '; you are ' + request.userInfo.username + ' (groups: '
        + (has(request.userInfo.groups) ? request.userInfo.groups.join(', ') : 'none')
        + '). Group membership comes from your credential, not from a binding:'
        + ' the O= of your client certificate, a groups claim of your OIDC provider,'
        + ' or --as-group when you impersonate.'
  validations:
    - expression: "!variables.readersOrPlaceChanged || variables.isAdmin"
      messageExpression: >-
        'only an admin (group ' + params.data.adminGroup + ') may create a backup policy or change its'
        + ' encryption or sink (they decide who can read the snapshots and where they go)'
        + variables.howToJoin
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: etcdbackuppolicy-guard
spec:
  policyName: etcdbackuppolicy-guard
  validationActions: ["Deny"]
  paramRef:
    name: hostoperation-approval
    namespace: pk-metal
    parameterNotFoundAction: Deny
