# The HostOperation human gate (design doc § Operations): approval is a CEL-guarded
# FIELD, not a subresource — a ValidatingAdmissionPolicy (no webhook, no cert, no pod)
# enforces the identity rules that schema CEL cannot (they need request.userInfo).
# Structural immutability (hostRef, actions frozen) lives in the CRD schema, so
# "patch" is "approve" and ordinary RBAC recovers the CSR permission split:
# metal-operator may CREATE (propose), metal-approver may PATCH (approve).
#
# CEL note: oldObject is null on CREATE — every reference to it sits behind a
# lazily-evaluated request.operation ternary (the null-oldObject guard).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hostoperation-approval
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["metal.pk.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["hostoperations"]
  variables:
    - name: newApprover
      expression: >-
        has(object.spec.approval) && has(object.spec.approval.approvedBy)
        ? object.spec.approval.approvedBy : ''
    - name: oldApprover
      expression: >-
        request.operation == 'UPDATE'
        && has(oldObject.spec.approval) && has(oldObject.spec.approval.approvedBy)
        ? oldObject.spec.approval.approvedBy : ''
  validations:
    - expression: "request.operation != 'CREATE' || variables.newApprover == ''"
      message: an operation cannot be created pre-approved
      reason: Forbidden
    - expression: "variables.oldApprover == '' || variables.newApprover == variables.oldApprover"
      message: approval is write-once
      reason: Forbidden
    - expression: >-
        variables.newApprover == variables.oldApprover
        || variables.newApprover == request.userInfo.username
      message: you may only approve as yourself (approvedBy must equal your username)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hostoperation-approval
spec:
  policyName: hostoperation-approval
  validationActions: ["Deny"]
