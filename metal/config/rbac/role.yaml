---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pk-metal-manager
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - metal.pk.io
  resources:
  - assets
  - biosprofiles
  - endpointprofiles
  - firmwareprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metal.pk.io
  resources:
  - assets/finalizers
  - biossettings/status
  - hostclaims/status
  - hostoperations/status
  - managementendpoints/finalizers
  verbs:
  - update
- apiGroups:
  - metal.pk.io
  resources:
  - biosschemas
  - biossettings
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - metal.pk.io
  resources:
  - hostclaims
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - metal.pk.io
  resources:
  - hostoperations
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - metal.pk.io
  resources:
  - hosts
  - managementendpoints
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - metal.pk.io
  resources:
  - hosts/status
  - managementendpoints/status
  verbs:
  - patch
- apiGroups:
  - os.pk.io
  resources:
  - bootassets
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - os.pk.io
  resources:
  - bootassets/finalizers
  - bootassets/status
  - talosclusters/finalizers
  - talosclusters/status
  - talosnodes/finalizers
  - talosnodes/status
  verbs:
  - update
- apiGroups:
  - os.pk.io
  resources:
  - talosclusters
  - talosnodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pk-metal-manager
  namespace: pk-metal
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
