# Who may open a connection to the manager's pod. The media port answers only
# the BMC network: a grant URL that leaks is then of no use outside it.
#
# The BMC network is a site value. The base has a documentation range
# (192.0.2.0/24) that matches no BMC, so a site that does not set it gets no
# install until it does: the BMC mount then fails with a connection error.
# Replace the cidr in your overlay with a JSON patch, as
# config/samples/site-overlay/networkpolicy.yaml does.
#
# The policy sees the source address after any SNAT. A NodePort Service with
# externalTrafficPolicy: Cluster can give a connection the address of the node
# that took it; then add the node network as a second ipBlock, or set
# externalTrafficPolicy: Local on pk-metal-media. A load balancer or a proxy in
# front of the media service replaces the address as well.
#
# Your CNI must enforce NetworkPolicy; with one that does not, this does
# nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pk-metal-manager
  namespace: pk-metal
  labels:
    app.kubernetes.io/name: pk-metal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pk-metal
      app.kubernetes.io/component: manager
  policyTypes: ["Ingress"]
  ingress:
    # The media service: BMCs fetch granted media through the NodePort. Keep
    # this rule first: the site overlay patches /spec/ingress/0.
    - ports:
        - port: media
      from:
        - ipBlock:
            cidr: 192.0.2.0/24 # the BMC network: set it in your overlay
    # Metrics: the manager answers only a caller whose Kubernetes token may
    # get /metrics. Narrow it to the namespace Prometheus runs in, if you like.
    - ports:
        - port: metrics
    # Health probes come from the kubelet on the node.
    - ports:
        - port: health
