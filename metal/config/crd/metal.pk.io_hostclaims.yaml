---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hostclaims.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: HostClaim
    listKind: HostClaimList
    plural: hostclaims
    singular: hostclaim
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.assetRef.name
          name: Asset
          type: string
        - jsonPath: .status.hostRef.name
          name: Host
          type: string
        - jsonPath: .spec.os.nodeRef.name
          name: Node
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.conditions[?(@.type=="Provisioned")].reason
          name: Provisioned
          type: string
        - jsonPath: .status.blockedOn
          name: Blocked
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            HostClaim takes one machine for your use. What it does to the machine:

            - Creating it with spec.os proposes installing that TalosNode. Once the install is approved, the disk picked by the TalosNode's installDiskSelector is erased and overwritten.
            - Deleting it releases the machine. If the operator installed the machine, it is shut down: a graceful shutdown first, then forced off after 5 minutes (the manager's --release-shutdown-timeout). If the machine runs a node, the shutdown waits for approval unless spec.provisioning.approval is Automatic. A machine the claim never installed is left running.
            - Without spec.os the claim only reserves the machine; nothing is done to it.

            Each proposed step is a HostOperation; with approval Required (the default) it waits until you run pk-metal approve <namespace>/<operation>. To stop all proposals for a claim, set the metal.pk.io/hold annotation on it. After a finished install, status.handOff records which machine runs which node; the operator does not install it again.

            A claim binds exactly one Host, and only one claim can hold a Host. Keep claims in git, so that taking a machine is a reviewed change.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: |-
                HostClaimSpec says which machine you want and what it should run. You pick the machine by its Asset, because you know the Asset name before the operator has found the machine and named its Host.

                The machine a claim names cannot be changed: pointing it elsewhere would leave the first machine running without a release. To use another machine, delete the claim and create a new one.
              properties:
                assetRef:
                  description: AssetRef names the Asset whose machine this claim binds.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                labels:
                  additionalProperties:
                    description: LabelValue is one label value. It must be a valid Kubernetes label value, so that a value the Host would reject is refused when you apply the claim.
                    maxLength: 63
                    pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                    type: string
                  description: 'Labels are copied onto the bound Host and removed when the claim goes away, for example role: worker. EndpointProfiles and firmware plans select machines by them. Keys have no prefix (no "/"), so they never clash with the labels the operator sets under metal.pk.io/.'
                  maxProperties: 16
                  type: object
                  x-kubernetes-validations:
                    - message: label keys must be unprefixed valid label names
                      rule: self.all(k, size(k) <= 63 && k.matches('^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'))
                os:
                  description: OS names the TalosNode the machine should run. Setting it proposes an install that erases the disk chosen by the TalosNode's installDiskSelector. Without it the claim only reserves the machine and nothing is done to it.
                  properties:
                    nodeRef:
                      description: NodeRef names the TalosNode (os.pk.io) whose config the machine boots.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - nodeRef
                  type: object
                  x-kubernetes-validations:
                    - message: 'os.nodeRef is immutable: drop the OS intent first, or create another claim'
                      rule: self.nodeRef == oldSelf.nodeRef
                provisioning:
                  description: Provisioning tunes how the operator installs the OS onto the machine.
                  properties:
                    approval:
                      default: Required
                      description: 'Approval: Required (default) or Automatic.'
                      enum:
                        - Required
                        - Automatic
                      type: string
                  type: object
                systemRef:
                  description: SystemRef picks one machine by its Redfish system id when the BMC manages more than one (a multi-node chassis). Leave it out when the BMC manages one machine.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
              required:
                - assetRef
              type: object
              x-kubernetes-validations:
                - message: 'assetRef is immutable: delete the claim and create another'
                  rule: self.assetRef == oldSelf.assetRef
                - message: 'systemRef is immutable: delete the claim and create another'
                  rule: has(self.systemRef) == has(oldSelf.systemRef) && (!has(self.systemRef) || self.systemRef == oldSelf.systemRef)
            status:
              description: HostClaimStatus says which machine the claim holds and how far its install got. The Host's spec.claimRef is what actually holds the machine; the first claim to set it wins.
              properties:
                blockedOn:
                  description: 'BlockedOn says why the claim is not moving on: why it cannot bind (AssetNotFound, AssetNotMaterialized, HostAlreadyClaimed) or, once bound, why the install waits (Approval(Provisioning), HeldByUser, HostInMaintenance, OperationFailed). kubectl describe shows the message with the command to run.'
                  type: string
                conditions:
                  description: Conditions are the truth — the only thing reconcilers branch on.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                handOff:
                  description: 'HandOff records that the machine was installed: which host runs which TalosNode, from which config, since when. It is written once, when the boot finishes, and is the record the operator reads to know the work is done — a node that is down later is not installed again, and deleting old HostOperations changes nothing. It goes away with the claim.'
                  properties:
                    at:
                      description: At is when the operator saw the hand-off.
                      format: date-time
                      type: string
                    configDigest:
                      description: ConfigDigest is sha256:<hex> of the rendered config the machine booted with; empty when the record was rebuilt from an operation that did not carry it.
                      type: string
                    host:
                      description: Host is the Host the node was installed on.
                      type: string
                    node:
                      description: Node is the TalosNode the machine runs.
                      type: string
                    operation:
                      description: 'Operation is the boot operation (namespace/name) that installed the machine. Empty when the machine already ran the node when the claim found it: the operator never touched it, so a release leaves its power alone.'
                      type: string
                  required:
                    - at
                    - host
                    - node
                  type: object
                hostRef:
                  description: HostRef names the bound Host.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                phase:
                  description: 'Phase summarizes the conditions below for people and for kubectl columns. It is a summary, not the contract: automation should read conditions.'
                  enum:
                    - Pending
                    - Bound
                    - Ambiguous
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
