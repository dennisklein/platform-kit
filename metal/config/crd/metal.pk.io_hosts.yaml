---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hosts.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: Host
    listKind: HostList
    plural: hosts
    singular: host
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.identity.serial
          name: Serial
          type: string
        - jsonPath: .status.identity.vendor
          name: Vendor
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.blockedOn
          name: Blocked
          priority: 1
          type: string
        - jsonPath: .spec.claimRef.name
          name: Claim
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Host is one realized machine (Redfish ComputerSystem), keyed by identity, reached via managedBy paths. Cluster-scoped; bound by a namespaced HostClaim.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: HostSpec carries the claim bind and the OS payload hand-off. Both are stamped by the HostClaimReconciler (single writer); everything else about a Host is discovered, not authored.
              properties:
                claimRef:
                  description: 'ClaimRef is the authoritative bind pointer (PV-style): set by the HostClaimReconciler, first writer wins via apiserver optimistic concurrency. The UID pins the exact claim object — a deleted-and-recreated claim of the same name is a different claimant.'
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      description: UID is a type that holds unique ID values, including UUIDs.  Because we don't ONLY use UUIDs, this is an alias to string.  Being a type captures intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                  required:
                    - name
                    - namespace
                  type: object
                os:
                  description: 'OS is the operating system this machine should be running, copied here from the claim that bound it and cleared when the claim is released. Setting it is what starts provisioning: until it is present, a bound machine is reserved and idle.'
                  properties:
                    nodeRef:
                      description: NodeRef points at the TalosNode (os.pk.io, cluster-scoped like the Host) whose rendered config this machine boots.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - nodeRef
                  type: object
              type: object
            status:
              description: HostStatus is discovered truth about the machine itself.
              properties:
                blockedOn:
                  description: BlockedOn is derived — why the host isn't advancing (Approval(bios), SerialMismatch); a reason, not a phase, because it recurs across phases.
                  type: string
                conditions:
                  description: Conditions are the truth — the only thing reconcilers branch on.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                firmwareProposed:
                  description: FirmwareProposed is the firmware domain's plan memory (the BIOS domain's lives on the materialized BiosSettings). Written by the convergence reconciler alone; the HostReconciler leaves it untouched — the two share this status with disjoint fields.
                  properties:
                    operation:
                      description: Operation is the proposed HostOperation as namespace/name.
                      type: string
                    planHash:
                      description: PlanHash is the sha256 of the desired state the operation serves.
                      type: string
                  required:
                    - operation
                    - planHash
                  type: object
                identity:
                  description: 'HostIdentity is the vendor-normalized anchor — independent of access path (the multipath discipline). Computed by a per-vendor strategy over bmc.Client: Huawei''s ComputerSystem carries the chassis serial, Supermicro''s carries none (the board serial lives on Chassis); the normalizer must return byte-identical identity for a system reached via two managers (the identity-invariant test).'
                  properties:
                    serial:
                      description: Serial is the normalized serial anchor (chassis board serial on Supermicro, system serial on Huawei).
                      type: string
                    uuid:
                      type: string
                    vendor:
                      type: string
                  type: object
                lastResetTime:
                  description: 'LastResetTime is the newest reset-time observation across paths — the drift memory: an advance with no explaining HostOperation raises Drifted. Absent where the vendor serves no such observable (iBMC) — drift detection then degrades openly rather than being simulated.'
                  format: date-time
                  type: string
                managedBy:
                  description: 'ManagedBy lists the discovered access paths — a list, length 1 today, N-ready (multiple managers, moved boards, Redfish aggregators). Atomic: one writer (the HostReconciler) replaces it whole.'
                  items:
                    description: ManagementPath is one discovered way to reach this host (from Redfish Links.ManagedBy) — N fungible paths with independent health, never an identity.
                    properties:
                      endpointRef:
                        description: EndpointRef names the ManagementEndpoint fronting this system.
                        properties:
                          name:
                            type: string
                        required:
                          - name
                        type: object
                      reachable:
                        description: Reachable is this path's independent health.
                        type: boolean
                      systemId:
                        description: SystemID is the Redfish ComputerSystem member id behind that endpoint, opaque.
                        type: string
                    required:
                      - endpointRef
                      - reachable
                      - systemId
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                phase:
                  description: 'Phase summarizes the conditions below for people and for kubectl columns. It is a summary, not the contract: automation should read conditions.'
                  enum:
                    - Enrolling
                    - Inspecting
                    - Available
                    - Assigned
                    - Provisioning
                    - Provisioned
                    - Releasing
                    - Failed
                    - Maintenance
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
