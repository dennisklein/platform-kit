---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: assets.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: Asset
    listKind: AssetList
    plural: assets
    singular: asset
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.cid
          name: CID
          type: string
        - jsonPath: .spec.serial
          name: Serial
          type: string
        - jsonPath: .spec.bmcMac
          name: BMC MAC
          type: string
        - jsonPath: .status.conditions[?(@.type=="Materialized")].reason
          name: Endpoint
          type: string
        - jsonPath: .spec.vlan
          name: VLAN
          priority: 1
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Asset is one physical machine as your records know it: its serial number and the MAC address of its BMC. You create one per machine, by hand or from your CMDB or inventory export. It is the entry point: the operator does nothing with a machine until an Asset names it.

            The operator finds the address of the BMC in the ledger from the bmcMac, and creates a ManagementEndpoint. Through that BMC it finds the machine and creates a Host. It checks that the serial and the MAC that it finds agree with this spec. Thus a cabling or ledger mistake stops the work, and the operator does not touch the wrong machine.

            The status tells one thing only: whether the operator could make a ManagementEndpoint from the Asset (condition Materialized). If not, it tells why. Usually the bmcMac is not in the ledger. All that the cluster learns from the machine goes on the ManagementEndpoint and the Host. These kinds keep a copy of the Asset spec that they last read. If the source of the Assets is not available, they use the last known values and the work goes on.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: 'AssetSpec is what your records say about the machine — never what the operator found by looking. Keeping the two apart is what lets the operator catch a mistake: it compares what you wrote here with what the BMC reports.'
              properties:
                bmcMac:
                  description: BMCMac is the MAC address of the BMC's own network port, as printed on the label or shown by `ipmitool lan print`. Either case, with ':' or '-' between the bytes. The operator looks it up in the ledger to find the BMC's address, and checks that the BMC at that address reports it.
                  maxLength: 17
                  type: string
                  x-kubernetes-validations:
                    - message: bmcMac must be a MAC address such as 0c:c4:7a:12:34:56 (upper case and '-' separators are fine)
                      rule: self.matches('^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$') || self.matches('^[0-9A-Fa-f]{2}(-[0-9A-Fa-f]{2}){5}$')
                cid:
                  description: CID is your asset tag or CMDB id for the machine; any unique string.
                  minLength: 1
                  type: string
                credentialsRef:
                  description: CredentialsRef names a Secret in the operator's namespace with the BMC's login (keys username and password), usually the factory default. An EndpointProfile can later move the BMC to a managed account; this login then stays as the way back in.
                  properties:
                    name:
                      default: ""
                      description: 'Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                serial:
                  description: 'Serial is the machine''s serial number as your records have it: the chassis or board serial on the label. The operator compares it with the serial the BMC reports, and does nothing to the machine if they differ.'
                  minLength: 1
                  type: string
                vlan:
                  description: VLAN is the management network the BMC is on. It is used only to pick matching EndpointProfiles; the operator does not configure any network.
                  maximum: 4094
                  minimum: 1
                  type: integer
              required:
                - cid
                - credentialsRef
                - serial
              type: object
            status:
              description: AssetStatus says whether the Asset became a ManagementEndpoint.
              properties:
                conditions:
                  description: 'Conditions: Materialized. True names the endpoint; False says what is missing (NoBMCMac, NoLedgerEntry, LedgerEntryInvalid, MaterializeConflict) and how to fix it.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
