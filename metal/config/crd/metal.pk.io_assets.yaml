---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: assets.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: Asset
    listKind: AssetList
    plural: assets
    singular: asset
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.cid
          name: CID
          type: string
        - jsonPath: .spec.serial
          name: Serial
          type: string
        - jsonPath: .spec.bmcMac
          name: BMC MAC
          type: string
        - jsonPath: .status.conditions[?(@.type=="Materialized")].reason
          name: Endpoint
          type: string
        - jsonPath: .spec.vlan
          name: VLAN
          priority: 1
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Asset is what the organization asserts about one machine: the serial it was bought under, the MAC of its management controller, where it was installed. It is the entry point — creating an Asset is how a machine becomes known to the cluster at all.

            Its status says one thing only: whether the operator could turn it into a ManagementEndpoint (condition Materialized), and if not, why — most often a bmcMac that is not in the ledger. Everything the cluster learns by looking at the machine lands on the ManagementEndpoint and Host. Those kinds keep a copy of the Asset spec they last resolved, so an outage of whatever authors Assets degrades to the last known values instead of stopping work.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: AssetSpec is the org's assertion about one physical machine — what the CMDB *claims*, never what Redfish discovered (the two must stay independent origins or Verified compares Redfish to Redfish and can catch nothing). Filled today by Flux from git YAML; filled later by fnt-sync from FNT Command — same CR downstream.
              properties:
                bmcMac:
                  description: BMCMac is the MAC address of the BMC's own network port, as printed on the label or shown by `ipmitool lan print`. Either case, with ':' or '-' between the bytes. The operator looks it up in the ledger to find the BMC's address, and checks that the BMC at that address reports it.
                  maxLength: 17
                  type: string
                  x-kubernetes-validations:
                    - message: bmcMac must be a MAC address such as 0c:c4:7a:12:34:56 (upper case and '-' separators are fine)
                      rule: self.matches('^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$') || self.matches('^[0-9A-Fa-f]{2}(-[0-9A-Fa-f]{2}){5}$')
                cid:
                  description: CID is the org's durable identity for this machine (FNT Configuration Item ID).
                  minLength: 1
                  type: string
                credentialsRef:
                  description: CredentialsRef names a Secret in the operator's namespace holding the endpoint credentials — factory creds at adoption, rotated by EndpointProfile.
                  properties:
                    name:
                      default: ""
                      description: 'Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                serial:
                  description: Serial is the org-asserted chassis/board serial — the Verify join key, checked against discovery (assertion vs Redfish, two origins).
                  minLength: 1
                  type: string
                vlan:
                  description: VLAN is the management network the endpoint lives on (1034 servers, 1035 routers).
                  maximum: 4094
                  minimum: 1
                  type: integer
              required:
                - cid
                - credentialsRef
                - serial
              type: object
            status:
              description: AssetStatus says whether the Asset became a ManagementEndpoint.
              properties:
                conditions:
                  description: 'Conditions: Materialized. True names the endpoint; False says what is missing (NoBMCMac, NoLedgerEntry, LedgerEntryInvalid, MaterializeConflict) and how to fix it.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
