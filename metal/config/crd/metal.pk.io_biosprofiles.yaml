---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: biosprofiles.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: BiosProfile
    listKind: BiosProfileList
    plural: biosprofiles
    singular: biosprofile
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.layer
          name: Layer
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            BiosProfile is a set of BIOS settings that some group of machines should share — authored in git, applying to whichever Hosts match its selector. Several may match one machine; they are layered, and the result of that layering is the machine's BiosSettings, which records which profile each value came from.

            Nothing reconciles a BiosProfile directly. It states intent; the settings it produces are what a machine is held against.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: BiosProfileSpec is one layer of desired BIOS configuration for the Hosts it matches. Profiles are git-authored data — no controller reconciles a profile; the convergence reconciler materializes the merged result per host into a BiosSettings object.
              properties:
                attributes:
                  additionalProperties:
                    x-kubernetes-preserve-unknown-fields: true
                  description: Attributes are the BIOS attributes this profile manages, values as the vendor's attribute registry types them (enum string, boolean, integer). An attribute omitted here is unmanaged — a higher layer can override a value but not retract management.
                  minProperties: 1
                  type: object
                layer:
                  default: 0
                  description: 'Layer orders overlapping profiles: materialization merges matched profiles by (layer, name) and a later layer deliberately overrides an earlier one — a role profile (layer 10) over a hardware baseline (layer 0). Two profiles on the SAME layer setting the same attribute to different values are a conflict, and conflict holds the whole materialization.'
                  format: int32
                  type: integer
                match:
                  description: 'Match selects Hosts by label. Two label axes exist by construction: intent labels stamped from the bound claim (role: worker — absent on unclaimed machines) and discovered facts (metal.pk.io/vendor, …/model — present regardless of claim state, the axis for hardware baselines).'
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                      items:
                        description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies to.
                            type: string
                          operator:
                            description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                            type: string
                          values:
                            description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                          - key
                          - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                      type: object
                  type: object
                  x-kubernetes-map-type: atomic
              required:
                - attributes
                - match
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources: {}
