---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: managementendpoints.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: ManagementEndpoint
    listKind: ManagementEndpointList
    plural: managementendpoints
    shortNames:
      - mep
    singular: managementendpoint
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.address
          name: Address
          type: string
        - jsonPath: .status.vendor
          name: Vendor
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.blockedOn
          name: Blocked
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            ManagementEndpoint is one BMC — iDRAC, iLO, XCC, iBMC or any other Redfish controller — that the operator talks to. The operator creates it from an Asset; you read it to see whether the BMC answers and what it reports (kubectl get mep).

            Its status holds what the BMC reports: vendor, model, serial numbers, the machines behind it, virtual media slots and firmware. The Verified condition compares that with the Asset. Phase Mismatch means the BMC at this address is not the machine that the Asset describes. The operator then does nothing to it. Phase Unreachable means that nothing answered at the address.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: ManagementEndpointSpec is written by the operator from the Asset and the ledger; you do not edit it.
              properties:
                address:
                  description: 'Address is the BMC''s https URL, from the ledger. It is how the operator reaches the machine, not what identifies it: a Host is identified by the serial number the BMC reports.'
                  pattern: ^https://
                  type: string
                assetRef:
                  description: AssetRef names the Asset this endpoint was made from, and whose serial and MAC it is checked against.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                credentialsRef:
                  description: CredentialsRef names the Secret (operator namespace) used to connect, defaulted from the Asset at materialization — the factory credentials, kept as standing break-glass. Once an EndpointProfile rotates the endpoint onto a managed account, every connect prefers the managed Secret and this ref is the repair fallback.
                  properties:
                    name:
                      default: ""
                      description: 'Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                tls:
                  description: TLS says how the BMC's HTTPS certificate is checked, from the manager's --bmc-ca-secret or --bmc-insecure. Unset uses the system's trusted CAs.
                  properties:
                    caSecretRef:
                      description: CASecretRef names a Secret (operator namespace, key ca.crt) with the CA that signed the BMC's certificate. Wins over insecureSkipVerify.
                      properties:
                        name:
                          default: ""
                          description: 'Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    insecureSkipVerify:
                      description: InsecureSkipVerify accepts any certificate. For simulated BMCs in the lab only.
                      type: boolean
                  type: object
              required:
                - address
                - assetRef
              type: object
            status:
              description: ManagementEndpointStatus is what the BMC reports; what your records say is on the Asset.
              properties:
                asset:
                  description: Asset caches the last-resolved assertion, so an asset-source outage degrades to the snapshot rather than failing resolution.
                  properties:
                    bmcMac:
                      type: string
                    cid:
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the Asset generation this snapshot was resolved at.
                      format: int64
                      type: integer
                    serial:
                      type: string
                    vlan:
                      type: integer
                  type: object
                authentication:
                  description: 'Authentication is how the operator''s requests to this BMC authenticate: Session (a Redfish session; the password crosses the network once per pass, in the login) or Basic (the BMC offers no session, so each request carries the password).'
                  enum:
                    - Session
                    - Basic
                  type: string
                blockedOn:
                  description: BlockedOn is derived — why the endpoint isn't advancing (e.g. SerialMismatch).
                  type: string
                boardSerial:
                  description: BoardSerial is the chassis board serial — the Supermicro identity anchor (its ComputerSystem serves none; Huawei's matches the system serial).
                  type: string
                capabilities:
                  description: EndpointCapabilities is what this BMC can do, as discovered. Vendors differ here, and the operator records the difference instead of assuming it.
                  properties:
                    dualMedia:
                      description: DualMedia is true when two virtual media slots can hold an image at the same time (Supermicro X12 yes, Huawei iBMC no). The install needs this to mount the installer and the config of the node together.
                      type: boolean
                    identityDialect:
                      description: IdentityDialect is how the HTTPS certificate of the BMC is replaced ("csr-native" | "key-upload" | "none"). The iBMC makes its CSR itself, and the key never leaves it. The X12 takes a certificate and a key that the operator makes, through an OEM upload.
                      type: string
                    mediaDialects:
                      additionalProperties:
                        type: string
                      description: MediaDialects maps media slot id → insert dialect ("insert-media" | "vmm-control" | "none").
                      type: object
                    updateDialect:
                      description: UpdateDialect is the firmware-update method the BMC offers ("multipart-push" | "simple-update" | "none"). The operator proposes a firmware flash only over multipart-push, the one it has been tested with.
                      type: string
                  type: object
                conditions:
                  description: Conditions are the truth — the only thing reconcilers branch on.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                firmware:
                  description: Firmware lists the UpdateService inventory — the firmware-convergence observable (desired version vs the entries here), small and bounded (~5 members per vendor). Sorted by id.
                  items:
                    description: 'FirmwareInventoryItem is one UpdateService SoftwareInventory member as discovered. IDs are vendor-shaped (X12: BMC/Backup_BMC/…, iBMC: ActiveBMC/…) and kept opaque.'
                    properties:
                      id:
                        type: string
                      updateable:
                        type: boolean
                      version:
                        type: string
                    required:
                      - id
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                firmwareVersion:
                  description: FirmwareVersion is the manager's firmware as served.
                  type: string
                identityPushed:
                  description: IdentityPushed is written by the endpoint convergence reconciler alone; the observing endpoint reconciler leaves it untouched — the two share this status with disjoint fields.
                  properties:
                    fingerprint:
                      description: Fingerprint (sha256, hex) of the pushed leaf certificate.
                      type: string
                    planHash:
                      description: PlanHash of the desired identity the push belonged to.
                      type: string
                  required:
                    - fingerprint
                    - planHash
                  type: object
                managerType:
                  description: ManagerType is the discovered Redfish Manager type, kept opaque (BMC | EnclosureManager | RackManager | …).
                  type: string
                model:
                  type: string
                phase:
                  description: 'Phase summarizes the conditions below for people and for kubectl columns. It is a summary, not the contract: automation should read conditions.'
                  enum:
                    - Pending
                    - Connecting
                    - Inventorying
                    - Verifying
                    - Configuring
                    - Ready
                    - Unreachable
                    - Mismatch
                  type: string
                systems:
                  description: 'Systems lists the machines (Redfish ComputerSystems) behind this BMC — usually one, several for a chassis with more than one node. It is kept like the rest of status: an unreachable endpoint keeps its last view.'
                  items:
                    description: DiscoveredSystem is one ComputerSystem as seen through this endpoint — the projection the HostReconciler joins into identity-keyed Hosts. ID is a path coordinate (an opaque Redfish member id), never an identity; identity is normalized in internal/identity over the serial anchors.
                    properties:
                      bootOverrideMode:
                        description: BootOverrideMode is the BootSourceOverrideMode the system serves ("UEFI" | "Legacy"); empty when it serves none. A boot override asks for UEFI only where this field shows a different mode. The X12 reports Legacy on a machine that boots UEFI, and a system that serves no mode can refuse one.
                        type: string
                      bootTargets:
                        description: BootTargets are the boot override targets the system allows (BootSourceOverrideTarget@Redfish.AllowableValues) — what a proposed boot override picks from, never assumed.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      id:
                        description: ID is the Redfish ComputerSystem member id behind this endpoint.
                        type: string
                      lastResetTime:
                        description: LastResetTime as served by the ComputerSystem — the baseline-and-advance observable (X12 serves it, iBMC doesn't). Micro precision so back-to-back resets stay distinguishable.
                        format: date-time
                        type: string
                      manufacturer:
                        description: Manufacturer as served by the ComputerSystem — the machine's vendor, which on an aggregator path differs from the endpoint's vendor.
                        type: string
                      model:
                        type: string
                      serialNumber:
                        description: SerialNumber as served by the ComputerSystem — the Huawei anchor; empty on Supermicro X12 (there the chassis board serial anchors).
                        type: string
                      uuid:
                        type: string
                    required:
                      - id
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                vendor:
                  description: Vendor is the discovered manufacturer ("Huawei" | "Supermicro" | …).
                  type: string
                virtualMedia:
                  description: 'VirtualMedia lists the media slots in the order of the endpoint''s collection, with the media types of each slot. A boot selects its slots by this list: optical slots first, in this order. capabilities.mediaDialects tells how to insert media in each slot.'
                  items:
                    description: DiscoveredMedia is one virtual media slot as the endpoint lists it.
                    properties:
                      id:
                        description: ID is the slot's Redfish member id ("CD", "VirtualMedia1", …).
                        type: string
                      mediaTypes:
                        description: MediaTypes the slot advertises ("CD", "DVD", "USBStick", …). Empty says nothing — the iBMC's CD slot serves none.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                      - id
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
