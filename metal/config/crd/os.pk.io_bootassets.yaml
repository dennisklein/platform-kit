---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bootassets.os.pk.io
spec:
  group: os.pk.io
  names:
    categories:
      - metal
      - os
    kind: BootAsset
    listKind: BootAssetList
    plural: bootassets
    singular: bootasset
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.strategy
          name: Strategy
          type: string
        - jsonPath: .spec.nodeRef.name
          name: Node
          type: string
        - jsonPath: .status.size
          name: Size
          type: integer
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: 'BootAsset is a built boot artifact and how to fetch it: the controller produces the artifact and reports readiness, digest, and — for grant-free strategies — a URL.'
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: BootAssetSpec declares one boot artifact. The strategy decides which of the remaining fields apply; the CEL rules on the kind enforce the pairing.
              properties:
                nodeRef:
                  description: NodeRef names the TalosNode whose rendered config the artifact carries. configISO and embeddedInstaller.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                schematic:
                  description: Schematic customizes the install image (system extensions, kernel arguments). factory and embeddedInstaller; omitted means the vanilla image.
                  properties:
                    customization:
                      description: SchematicCustomization holds the image customization knobs.
                      properties:
                        extraKernelArgs:
                          description: 'ExtraKernelArgs append to the image''s kernel command line, for example where to put the console (console=ttyS0, what the BMC''s serial-over-LAN shows). Do not add talos.config=metal-iso: the operator adds it to the boot medium itself, and the installed system must not carry it.'
                          items:
                            type: string
                          type: array
                        systemExtensions:
                          description: SystemExtensions bakes extensions into the image.
                          properties:
                            officialExtensions:
                              description: OfficialExtensions are siderolabs/* extension names (siderolabs/drbd).
                              items:
                                type: string
                              type: array
                          type: object
                      type: object
                  type: object
                strategy:
                  description: Strategy selects how the artifact is produced.
                  enum:
                    - configISO
                    - factory
                    - embeddedInstaller
                  type: string
                talosVersion:
                  description: TalosVersion pins the release of the install image. factory and embeddedInstaller.
                  pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                  type: string
              required:
                - strategy
              type: object
            status:
              description: BootAssetStatus reports the built artifact. Secret-bearing artifacts never get a stable URL — their fetch URLs are minted per mount as grants and revoked on node check-in, eject, or expiry.
              properties:
                artifactSecretRef:
                  description: ArtifactSecretRef is where the built artifact rests (key asset.iso), owned by this BootAsset and GC'd with it. configISO only.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                    - namespace
                  type: object
                buildJob:
                  description: BuildJob is the imager Job of the latest build, in the operator's namespace. A failed Job is kept so its log can be read. embeddedInstaller only.
                  type: string
                buildKey:
                  description: 'BuildKey names the inputs of the stored artifact: config, Talos version, schematic and imager image. A change of any input is a new key and a new build. embeddedInstaller only.'
                  type: string
                conditions:
                  description: 'Conditions: Ready.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                configDigest:
                  description: ConfigDigest is the rendered config (the TalosNode's status.configDigest) the stored artifact carries. embeddedInstaller only.
                  type: string
                digest:
                  description: Digest is sha256:<hex> of the artifact bytes. configISO and embeddedInstaller.
                  type: string
                size:
                  description: Size is the artifact size in bytes. configISO and embeddedInstaller.
                  format: int64
                  type: integer
                url:
                  description: URL is where the artifact is fetched without a grant. factory only.
                  type: string
              type: object
          required:
            - spec
          type: object
          x-kubernetes-validations:
            - message: configISO takes nodeRef and nothing else
              rule: self.spec.strategy != 'configISO' || (has(self.spec.nodeRef) && !has(self.spec.talosVersion) && !has(self.spec.schematic))
            - message: factory takes talosVersion (and optionally schematic), never nodeRef
              rule: self.spec.strategy != 'factory' || (!has(self.spec.nodeRef) && has(self.spec.talosVersion))
            - message: embeddedInstaller takes nodeRef and talosVersion (and optionally schematic)
              rule: self.spec.strategy != 'embeddedInstaller' || (has(self.spec.nodeRef) && has(self.spec.talosVersion))
      served: true
      storage: true
      subresources:
        status: {}
