---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: talosnodes.os.pk.io
spec:
  group: os.pk.io
  names:
    categories:
      - metal
      - os
    kind: TalosNode
    listKind: TalosNodeList
    plural: talosnodes
    singular: talosnode
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.clusterRef.name
          name: Cluster
          type: string
        - jsonPath: .spec.role
          name: Role
          type: string
        - jsonPath: .status.address
          name: Address
          type: string
        - jsonPath: .status.stage
          name: Stage
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.version
          name: Version
          priority: 1
          type: string
        - jsonPath: .status.conditions[?(@.type=="ConfigInSync")].status
          name: InSync
          priority: 1
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: 'TalosNode is one member of a TalosCluster: the machine-specific half of its configuration, and what the machine reports once it runs.'
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: TalosNodeSpec is what belongs to one machine. Its hostname is the object's metadata.name.
              properties:
                address:
                  description: Address is where the operator and talosctl reach the node's Talos API. Empty means the first static address of the first link. A node that only takes DHCP addresses needs it set, or its check-in has nothing to dial.
                  type: string
                clusterRef:
                  description: ClusterRef names the TalosCluster this node is a member of.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                installDiskSelector:
                  description: InstallDiskSelector picks the disk Talos installs onto. That disk is repartitioned and everything on it is erased. A disk matches when every matcher you set holds; if several disks match, Talos takes the first one it finds, which can change between boots. Prefer serial or wwid, which name exactly one disk.
                  properties:
                    busPath:
                      description: BusPath matches the disk's bus path. It changes when a disk moves to another slot.
                      type: string
                    match:
                      description: Match is a CEL expression over `disk` (Talos' disk locator environment), for example `disk.size > 100u * GB && !disk.rotational`.
                      type: string
                    model:
                      description: Model matches the disk model. Machines often have several disks of the same model; combine it with another matcher.
                      type: string
                    serial:
                      description: Serial matches the disk serial number. It names one disk and does not change when disks are re-cabled or found in another order.
                      type: string
                    wwid:
                      description: WWID matches the disk's world wide identifier.
                      type: string
                  type: object
                  x-kubernetes-validations:
                    - message: 'at least one matcher is required: a node that does not say where to install does not install'
                      rule: has(self.serial) || has(self.model) || has(self.wwid) || has(self.busPath) || has(self.match)
                labels:
                  additionalProperties:
                    type: string
                  description: Labels are Kubernetes node labels the kubelet registers with. Worker nodes may only set labels the NodeRestriction admission plugin allows.
                  type: object
                network:
                  description: Network configures the node's links.
                  properties:
                    links:
                      description: Links configure physical links, each selected by its MAC address.
                      items:
                        description: 'Link is one physical link: Talos aliases the link with the MAC address to Name (LinkAliasConfig), then configures it under that name (LinkConfig, and DHCPv4Config when DHCP is on). Naming links by alias keeps the rest of the configuration, and every patch, independent of what the kernel calls the interface on a given board.'
                        properties:
                          addresses:
                            description: Addresses are static addresses in CIDR form, primary family first.
                            items:
                              type: string
                            type: array
                          dhcp:
                            description: DHCP runs a DHCPv4 client on the link, alongside any static addresses.
                            type: boolean
                          hardwareAddr:
                            description: 'HardwareAddr is the link''s permanent MAC address. A physical link whose driver reports no permanent address is matched on its current one instead. Lower case and colon-separated (0c:c4:7a:12:34:56): Talos compares it as text.'
                            pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
                            type: string
                          mtu:
                            description: MTU overrides the link MTU.
                            format: int32
                            minimum: 576
                            type: integer
                          name:
                            description: 'Name is the alias the link gets. Avoid kernel names (eth0, enp0s2): an alias must not collide with a real interface.'
                            pattern: ^[a-z][a-z0-9-]{0,14}$
                            type: string
                          routes:
                            description: Routes are static routes over this link.
                            items:
                              description: Route is a static route.
                              properties:
                                gateway:
                                  description: Gateway is the next hop.
                                  type: string
                                metric:
                                  description: Metric orders competing routes.
                                  format: int32
                                  type: integer
                                network:
                                  description: Network is the destination CIDR; empty is the default route.
                                  type: string
                              type: object
                            type: array
                        required:
                          - hardwareAddr
                          - name
                        type: object
                        x-kubernetes-validations:
                          - message: a link without DHCP needs at least one static address
                            rule: (has(self.dhcp) && self.dhcp) || (has(self.addresses) && size(self.addresses) > 0)
                      type: array
                      x-kubernetes-list-map-keys:
                        - name
                      x-kubernetes-list-type: map
                  type: object
                patches:
                  description: Patches apply to this node only, in order, after the cluster's patches.
                  items:
                    description: 'Patch is one Talos configuration patch: a multi-document YAML strategic merge patch (documents merge by apiVersion, kind and name; `$patch: delete` removes one), given inline or read from a ConfigMap key.'
                    properties:
                      configMapRef:
                        description: ConfigMapRef reads the patch from a ConfigMap key. The ConfigMap must have the label os.pk.io/patch; the operator reads no other.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                          - key
                          - name
                          - namespace
                        type: object
                      inline:
                        description: Inline is the patch text.
                        type: string
                    type: object
                    x-kubernetes-validations:
                      - message: exactly one of inline or configMapRef
                        rule: has(self.inline) != has(self.configMapRef)
                  type: array
                role:
                  description: Role is controlplane or worker.
                  enum:
                    - controlplane
                    - worker
                  type: string
                schematic:
                  description: 'Schematic customizes this node''s installer image and replaces the cluster''s schematic when set. Extensions and kernel arguments both live here: Talos takes the installed kernel command line from the image, so an argument that is not part of the schematic does not survive the install.'
                  properties:
                    customization:
                      description: SchematicCustomization holds the image customization knobs.
                      properties:
                        extraKernelArgs:
                          description: 'ExtraKernelArgs append to the image''s kernel command line, for example where to put the console (console=ttyS0, what the BMC''s serial-over-LAN shows). Do not add talos.config=metal-iso: the operator adds it to the boot medium itself, and the installed system must not carry it.'
                          items:
                            type: string
                          type: array
                        systemExtensions:
                          description: SystemExtensions bakes extensions into the image.
                          properties:
                            officialExtensions:
                              description: OfficialExtensions are siderolabs/* extension names (siderolabs/drbd).
                              items:
                                type: string
                              type: array
                          type: object
                      type: object
                  type: object
                taints:
                  description: Taints are Kubernetes node taints the kubelet registers with.
                  items:
                    description: Taint is a Kubernetes node taint.
                    properties:
                      effect:
                        description: TaintEffect is a Kubernetes taint effect.
                        enum:
                          - NoSchedule
                          - PreferNoSchedule
                          - NoExecute
                        type: string
                      key:
                        type: string
                      value:
                        type: string
                    required:
                      - effect
                      - key
                    type: object
                  type: array
              required:
                - clusterRef
                - installDiskSelector
                - role
              type: object
            status:
              description: 'TalosNodeStatus reports the render and the machine''s check-in. Rendered=False is alert-and-hold: the last rendered Secret stays in place, so a broken input never un-renders a machine''s config.'
              properties:
                address:
                  description: Address is where the check-in dials (spec.address, or the first static link address).
                  type: string
                appliedConfigDigest:
                  description: 'AppliedConfigDigest is the rendered config the machine was last seen to run: the digest of a render a dry run found no change against. Config Secrets of other digests are collected once nothing refers to them.'
                  type: string
                conditions:
                  description: 'Conditions: Rendered, plus the check-in observations MachineReachable and Ready while a Host hands this node a machine, ConfigInSync (the dry-run drift check) and VersionCurrent (Talos version skew).'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                configDigest:
                  description: ConfigDigest is sha256:<hex> of the rendered config, what BootAsset builds key their rebuilds on.
                  type: string
                configSecretRef:
                  description: ConfigSecretRef points at the Secret holding this node's rendered machine config (key config.yaml). Owned by the TalosNode and collected with it; it is the one place the rendered secrets rest.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                    - namespace
                  type: object
                drift:
                  description: Drift is the last dry run of the rendered config against the machine (ConfigInSync tells the verdict).
                  properties:
                    changed:
                      description: 'Changed: the machine runs a config that differs from this render.'
                      type: boolean
                    configDigest:
                      description: ConfigDigest is the rendered config the dry run was made with.
                      type: string
                    observedAt:
                      description: ObservedAt is when the dry run was made.
                      format: date-time
                      type: string
                    rebootRequired:
                      description: 'RebootRequired: the machine said it needs a reboot to take it.'
                      type: boolean
                    summary:
                      description: 'Summary counts the changed lines and names the configuration keys they touch. Values are left out: a diff of a machine config carries secrets.'
                      type: string
                  required:
                    - changed
                    - configDigest
                    - observedAt
                  type: object
                installerImage:
                  description: InstallerImage is the installer the rendered config installs from.
                  type: string
                renderedFor:
                  description: 'RenderedFor is the Talos version the config was rendered for: the cluster''s talosVersion, or the older version the machine still runs until its upgrade, so that a config is never written for a contract the running machine does not accept yet.'
                  type: string
                stage:
                  description: Stage is the machine's observed boot stage (maintenance, booting, installing, running, ...), empty while no machine answers.
                  type: string
                version:
                  description: Version is the Talos version the machine reports.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
