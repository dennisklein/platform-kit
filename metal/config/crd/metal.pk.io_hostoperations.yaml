---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hostoperations.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: HostOperation
    listKind: HostOperationList
    plural: hostoperations
    singular: hostoperation
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.hostRef.name
          name: Host
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.reason
          name: Reason
          type: string
        - jsonPath: .spec.proposedBy
          name: Proposed
          priority: 1
          type: string
        - jsonPath: .spec.approval.approvedBy
          name: Approved
          type: string
        - jsonPath: .status.blockedOn
          name: Blocked
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            HostOperation is one step that changes a machine — an install, a shutdown, a BIOS change, a firmware flash — and the record of what happened. The operator proposes it; spec.actions lists exactly what will be done, in order, so read it before you approve.

            - Approve:   pk-metal approve <namespace>/<operation> (someone other than the proposer must approve).
            - Refuse:    delete the operation, or set metal.pk.io/hold on the HostClaim so the operator stops proposing.
            - Retry:     pk-metal retry <namespace>/<operation> once you have fixed the cause. A failed operation is never retried on its own.

            kubectl get hostoperations shows what waits (Phase AwaitingApproval) and what failed; kubectl describe shows each step's message.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: |-
                HostOperationSpec is what to do to a machine, and the approval that lets it happen.

                The operator proposes an operation by creating it; a person approves it by setting spec.approval. The machine and the actions cannot be changed after creation, so the right to edit an operation is only the right to approve it. The cluster checks who may approve, and refuses an approval by the person who proposed the operation.
              properties:
                actions:
                  description: 'Actions run in order; each entry is exactly one action. A failed step fails the operation — disruptive one-shots never auto-retry. At most one power action per operation: the power-cycle proof lives in status once.'
                  items:
                    description: 'HostOperationAction is a one-of union: exactly one action per entry.'
                    maxProperties: 1
                    minProperties: 1
                    properties:
                      applyBios:
                        description: ApplyBios stages a BiosSettings object's desired attributes into the machine's pending (@Redfish.Settings) object. Staging changes nothing — the world moves at the next system reset, so a convergence operation pairs this with a powerCycle.
                        properties:
                          attributes:
                            additionalProperties:
                              x-kubernetes-preserve-unknown-fields: true
                            description: Attributes are the values to stage, copied in at proposal time — what the approver saw is exactly what is applied. Only the drifted subset is PATCHed; already-staged keys are converged goals, not conflicts.
                            minProperties: 1
                            type: object
                          settingsRef:
                            description: 'SettingsRef names the BiosSettings the attributes came from — provenance only: the executor never reads it, so an edit after approval cannot change what runs.'
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                        required:
                          - attributes
                        type: object
                      awaitCheckIn:
                        description: AwaitCheckIn waits, without touching the machine, until the named TalosNode reports that the machine runs its config — the point after which the boot media are no longer needed. It changes nothing; it keeps the operation (and the grants it issued) alive until the hand-off.
                        properties:
                          nodeRef:
                            description: 'NodeRef names the TalosNode (os.pk.io) whose check-in ends the wait: MachineReachable=True over the authenticated machine API, or Ready=True.'
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          timeoutSeconds:
                            default: 1800
                            description: TimeoutSeconds bounds the wait, counted from the previous step's end. Running out fails the step — the media are ejected and the grants revoked either way.
                            format: int32
                            maximum: 86400
                            minimum: 60
                            type: integer
                        required:
                          - nodeRef
                        type: object
                      ejectMedia:
                        description: EjectMedia unmounts a virtual-media slot.
                        properties:
                          mediaId:
                            description: MediaID is the virtual-media slot to empty.
                            type: string
                        required:
                          - mediaId
                        type: object
                      flashFirmware:
                        description: 'FlashFirmware pushes a firmware image to the management controller and waits for proof that it took: the controller rebooting, and the expected version reading back afterwards. A reported success is not believed on its own.'
                        properties:
                          image:
                            description: Image is the digest-pinned OCI reference to fetch and push (the same shape as FirmwareProfile.spec.manager.image).
                            pattern: '@sha256:[a-f0-9]{64}$'
                            type: string
                          version:
                            description: 'Version is the version expected to read back after the flash — the convergence goal: a manager already serving it makes this step a no-op.'
                            minLength: 1
                            type: string
                        required:
                          - image
                          - version
                        type: object
                      insertMedia:
                        description: InsertMedia mounts an image URL on a virtual-media slot, dispatching the dialect the endpoint advertises (standard InsertMedia vs OEM VmmControl).
                        properties:
                          bootAssetRef:
                            description: BootAssetRef names the BootAsset (os.pk.io) to mount.
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          digest:
                            description: 'Digest pins the artifact bytes (sha256:<hex>) the approver saw: an artifact rebuilt since the proposal fails the step instead of mounting content nobody approved. With a digest the asset need not be Ready: the artifact approved is mounted while a newer build runs, and an asset that names no artifact yet makes the step wait. Secret-bearing assets (configISO, embeddedInstaller) only.'
                            pattern: ^sha256:[a-f0-9]{64}$
                            type: string
                          imageUrl:
                            description: ImageURL is what to mount. Already-mounted with the same URL is success — steps converge to their goal, so a resumed operation never double-issues.
                            type: string
                          mediaId:
                            description: MediaID is the virtual-media slot ("CD", "USBStick", …).
                            type: string
                        required:
                          - mediaId
                        type: object
                        x-kubernetes-validations:
                          - message: exactly one of imageUrl and bootAssetRef
                            rule: has(self.imageUrl) != has(self.bootAssetRef)
                          - message: digest pins a bootAssetRef
                            rule: '!has(self.digest) || has(self.bootAssetRef)'
                      powerCycle:
                        description: 'PowerCycle restarts the system: off, observed off, on, observed on — or just on when it was off at the baseline. Each half converges on the reported power state, which every vendor serves, so a resumed operation never cycles a machine twice (the iBMC serves no reset time to tell).'
                        type: object
                      powerOff:
                        description: PowerOff turns the system off and waits until it reports off. With gracefulTimeoutSeconds it first asks the OS to shut down, and forces the machine off only if it is still on when that time has passed.
                        properties:
                          gracefulTimeoutSeconds:
                            description: GracefulTimeoutSeconds, when set, makes the step ask the OS to shut down first (Redfish GracefulShutdown, the same as a short press of the power button or `ipmitool chassis power soft`), wait this long for the machine to report off, and only then force it off. Unset or 0 forces the machine off at once. A BMC that refuses a graceful shutdown is forced at once too.
                            format: int32
                            maximum: 3600
                            minimum: 0
                            type: integer
                        type: object
                      setBootOverride:
                        description: SetBootOverride sets the source the machine boots from next. The target must be one the endpoint actually offers — machines disagree about what they call a virtual CD, so the value is checked against what was discovered rather than assumed.
                        properties:
                          mode:
                            description: Mode is the firmware boot mode for the override. Omitted leaves the machine's own setting alone (some firmware rejects the property).
                            enum:
                              - UEFI
                              - Legacy
                            type: string
                          once:
                            default: true
                            description: Once limits the override to the next boot (the default); false is Continuous.
                            type: boolean
                          target:
                            description: Target is the boot source (UsbCd, Cd, Pxe, …) — validated against the endpoint's discovered AllowableValues at execution, not at admission.
                            type: string
                        required:
                          - target
                        type: object
                    type: object
                  maxItems: 32
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: atomic
                  x-kubernetes-validations:
                    - message: at most one power action per operation
                      rule: self.filter(a, has(a.powerCycle) || has(a.powerOff)).size() <= 1
                    - message: actions are frozen after creation
                      rule: self == oldSelf
                approval:
                  default:
                    required: true
                  description: Approval is the human gate. Omitted means required — the safe default is a closed gate.
                  properties:
                    approvedBy:
                      description: ApprovedBy is stamped by the approver — the ValidatingAdmissionPolicy enforces that it equals the requesting username, is empty at creation, and is write-once.
                      type: string
                    required:
                      default: true
                      description: 'Required: this operation must be approved before it runs (from the disruption policy; explicit false only where the policy waives the gate, and admission lets only the operator or an admin create such an operation). A pointer so that EVERY client that says nothing — YAML omitting the key, a Go zero value — gets the safe default: a closed gate. Frozen: flipping it would be an approval without a name on it.'
                      type: boolean
                      x-kubernetes-validations:
                        - message: approval.required is frozen after creation
                          rule: self == oldSelf
                  type: object
                hostRef:
                  description: HostRef names the Host this operation acts on.
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                  x-kubernetes-validations:
                    - message: hostRef is frozen after creation
                      rule: self == oldSelf
                planHash:
                  description: PlanHash binds a proposed operation to the desired state it serves — an unchanged hash never spawns a second op (the convergence reconcilers' guard).
                  type: string
                proposedBy:
                  description: 'ProposedBy is the username that created the operation. Admission checks it against the creating request, so it cannot name someone else, and refuses an approval stamped by the same person: nobody approves their own proposal.'
                  minLength: 1
                  type: string
                reason:
                  description: Reason names the desired-state gate this operation serves (BiosConvergence, FirmwareConvergence, …); empty for a human-requested op. It becomes the Approval(<reason>) domain on the Host's blockedOn — hence the condition-reason shape.
                  maxLength: 128
                  pattern: ^[A-Za-z][A-Za-z0-9]*$
                  type: string
                ttlSecondsAfterFinished:
                  description: TTLSecondsAfterFinished garbage-collects a finished operation Job-style. Unset keeps it forever (human-requested ops stay as their own record); convergence proposals set it — the plan memory on the proposing object, not the operation's existence, is what keeps an unchanged planHash from spawning again.
                  format: int32
                  minimum: 0
                  type: integer
              required:
                - actions
                - hostRef
                - proposedBy
              type: object
              x-kubernetes-validations:
                - message: proposedBy is frozen after creation
                  rule: '!has(oldSelf.proposedBy) || (has(self.proposedBy) && self.proposedBy == oldSelf.proposedBy)'
            status:
              description: 'HostOperationStatus is what happened: which steps ran and how they ended, plus the observations that prove the machine really did what was asked.'
              properties:
                baseline:
                  description: Baseline is captured (and persisted) before the first mutating call.
                  properties:
                    capturedAt:
                      description: CapturedAt is when the baseline was taken — the start of execution, which bounds how long a power transition may take to show.
                      format: date-time
                      type: string
                    lastResetTime:
                      description: 'LastResetTime as observed before any action ran. Micro precision: the sim resets faster than a second, and second-precision would blind the advance predicate.'
                      format: date-time
                      type: string
                    powerState:
                      type: string
                  type: object
                blockedOn:
                  description: BlockedOn is derived — why the operation isn't advancing (AwaitingApproval, OperationQueued).
                  type: string
                conditions:
                  description: Conditions are the truth — the only thing reconcilers branch on.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedResetTime:
                  description: ObservedResetTime is the reset-time observation after the last step — the proof the reset happened, and what marks a Host reset-time advance as explained rather than Drifted.
                  format: date-time
                  type: string
                offObserved:
                  description: OffObserved is when the executor saw the machine report off during a power cycle — the first half of the cycle, recorded so that a resumed operation finishes the cycle instead of starting a second one.
                  format: date-time
                  type: string
                phase:
                  description: 'Phase summarizes the conditions below for people and for kubectl columns. It is a summary, not the contract: automation should read conditions.'
                  enum:
                    - Proposed
                    - AwaitingApproval
                    - Running
                    - Succeeded
                    - Failed
                  type: string
                shutdownRequested:
                  description: ShutdownRequested is when the executor asked the OS to shut down for a graceful powerOff. The step forces the machine off once the graceful window, counted from here, has passed; recording it means a resumed operation neither asks again nor restarts the window.
                  format: date-time
                  type: string
                steps:
                  description: 'Steps records each action''s outcome in execution order, written as each step reaches its goal. A resumed operation continues after the last recorded step: a goal that a later step consumed (a Once boot override used up by the boot that followed) is never re-armed.'
                  items:
                    description: OperationStep is one executed action's outcome.
                    properties:
                      action:
                        description: Action is the union key that ran (powerCycle, insertMedia, …).
                        type: string
                      finishedAt:
                        description: FinishedAt is when the step reached its goal (or failed).
                        format: date-time
                        type: string
                      message:
                        type: string
                      phase:
                        enum:
                          - Succeeded
                          - Failed
                        type: string
                    required:
                      - action
                      - phase
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
