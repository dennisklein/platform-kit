metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: biossettings.metal.pk.io
spec:
  group: metal.pk.io
  names:
    categories:
      - metal
    kind: BiosSettings
    listKind: BiosSettingsList
    plural: biossettings
    singular: biossettings
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Converged")].status
          name: Converged
          type: string
        - jsonPath: .status.conditions[?(@.type=="Converged")].reason
          name: Reason
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            BiosSettings is one machine's BIOS state: what is wanted, what is actually set, and where each wanted value came from. It is the merge of the BiosProfiles that match the Host. Read it before an apply, to see what changes and why.

            Cluster-scoped like its Host, named after it, and owned by it: deleting the machine takes its settings with it.
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: BiosSettingsSpec is the rendered desired BIOS state for ONE host — the merge of every matched BiosProfile, written by the convergence reconciler (its sole author). Named after its Host and owned by it.
              properties:
                attributes:
                  additionalProperties:
                    x-kubernetes-preserve-unknown-fields: true
                  description: 'Attributes is the merged desired attribute map. When two profiles conflict, the previous merge stays as it is: the operator alerts and holds, and never applies part of a conflicted state. status.provenance names the profile of each key.'
                  type: object
              type: object
            status:
              description: 'BiosSettingsStatus carries the observation side: the managed keys as the machine last served them, and the plan memory.'
              properties:
                conditions:
                  description: Conditions are the truth — the only thing reconcilers branch on.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the transition. This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observed:
                  additionalProperties:
                    x-kubernetes-preserve-unknown-fields: true
                  description: 'Observed caches the managed attributes as last read from the machine — status-as-cache: an unreachable pass keeps the last view.'
                  type: object
                pending:
                  additionalProperties:
                    x-kubernetes-preserve-unknown-fields: true
                  description: Pending caches the managed attributes staged in the @Redfish.Settings object — applied at the next system reset.
                  type: object
                proposed:
                  description: Proposed is the plan memory for the BIOS domain.
                  properties:
                    operation:
                      description: Operation is the proposed HostOperation as namespace/name.
                      type: string
                    planHash:
                      description: PlanHash is the sha256 of the desired state the operation serves.
                      type: string
                  required:
                    - operation
                    - planHash
                  type: object
                provenance:
                  additionalProperties:
                    type: string
                  description: Provenance names the profile that gave each attribute. Thus the object tells what the host gets and why, and you need not do the merge yourself.
                  type: object
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
