# What the machine in talos.yaml boots — both media at once. The per-node config
# medium is ~10 KB packed from that node's rendered config, carries secrets, and is
# served only for as long as it stays mounted. The install image is generic: the
# same bytes for every machine, no secrets in it, addressed by the content of its
# schematic.
apiVersion: os.pk.io/v1alpha1
kind: BootAsset
metadata:
  name: node-1-config
spec:
  strategy: configISO
  nodeRef:
    name: node-1
---
apiVersion: os.pk.io/v1alpha1
kind: BootAsset
metadata:
  name: install-drbd
spec:
  strategy: factory
  talosVersion: v1.14.6
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/drbd
