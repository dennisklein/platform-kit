# Miniature talconfig for the library-parity test: one CP with the named-interface/
# VIP/routes/schematic shape, one worker with the deviceSelector/labels shape —
# the two node styles the raven talconfig uses. The real parity gate against
# control/talos runs via `make -C metal parity`.
clusterName: parity
talosVersion: ${TALOS_VERSION}
kubernetesVersion: ${KUBERNETES_VERSION}
endpoint: https://10.77.35.200:6443
allowSchedulingOnControlPlanes: true
clusterPodNets:
  - fd6b:5a2e:1c4d:a000::/56
  - 10.244.0.0/16
clusterSvcNets:
  - fd6b:5a2e:1c4d:5000::/112
  - 10.96.0.0/12
additionalApiServerCertSans:
  - 10.77.38.200
additionalMachineCertSans:
  - 10.77.38.200
patches:
  - "@./patches/global/nameservers.yaml"
nodes:
  - hostname: cp1
    ipAddress: 10.77.38.202
    controlPlane: true
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/drbd
            - siderolabs/intel-ucode
    installDiskSelector:
      serial: PHLN000000000P6AGN
    patches:
      - "@./patches/node/sysctls.yaml"
    networkInterfaces:
      - interface: eno1np0
        dhcp: false
        mtu: 1500
        addresses:
          - 10.77.38.202/23
        routes:
          - network: 0.0.0.0/0
            gateway: 10.77.38.1
        vip:
          ip: 10.77.38.200
  - hostname: w1
    ipAddress: 10.77.35.204
    controlPlane: false
    nodeLabels:
      metal.internal/router: "true"
    installDiskSelector:
      serial: PHLN111111111P6AGN
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "02:00:48:0b:74:47"
        dhcp: false
        addresses:
          - fd6b:5a2e:1c4d:1035::204/64
          - 10.77.35.204/24
