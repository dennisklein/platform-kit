# Generated from lab/lab.yaml. Do not edit: change the spec and run mise run lab:up.
#
# The workload cluster the lab installs, on the lab bridge, the Kubernetes API
# on a virtual IP the control planes hold.
#
#   VIP     10.77.0.10
#   node-1  10.77.0.11  control plane
#
# Links and install disks are selected by what the fleet gives each machine
# (NIC MAC, disk serial), never by a device name that depends on probe order.
# The gateway is the workstation's end of the bridge, which NATs.
#
# The secrets bundle is not here and the operator never makes one. `mise run
# lab:up` generates it once on the workstation with `talosctl gen secrets` and
# creates the Secret the cluster names below (key secrets.yaml).
#
# The TalosCluster holds what every node shares (think group_vars, or the
# %include part of a kickstart); each TalosNode holds what is per machine
# (address, install disk, role). The operator renders one Talos machine
# configuration per node from the two. A machine that is already installed does
# not pick a change up by itself: push it with talosctl
# (talosctl -n <address> patch machineconfig --patch @change.yaml).
apiVersion: os.pk.io/v1alpha1
kind: TalosCluster
metadata:
  name: lab
  # lab.sh applies this as lab-admin: the requester (metal.pk.io/requested-by).
  annotations:
    metal.pk.io/requested-by: lab-admin
spec:
  talosVersion: v1.14.6
  kubernetesVersion: v1.36.2
  endpoint: https://10.77.0.10:6443
  controlPlane:
    vip: 10.77.0.10
    # No workers: ordinary workloads run on the control planes.
    allowScheduling: true
  network:
    cni:
      name: flannel
  # The workstation's registry, over plain HTTP: pk-metal pivot runs the
  # operator here with an image pushed there.
  registryMirrors:
    - registry: "10.77.0.1:5000"
      endpoints:
        - http://10.77.0.1:5000
  secretsRef:
    namespace: pk-metal
    name: lab-talos-secrets
  schematic:
    customization:
      extraKernelArgs:
        # The simulated BMC records the machine's serial console; without this
        # the boot is invisible in .lab/state/<machine>/console.log.
        - console=ttyS0
  # Talos machine configuration documents from the spec, merged into every
  # node's configuration. The operator adds nothing here on its own.
  patches:
    - inline: |
        apiVersion: v1alpha1
        kind: TimeSyncConfig
        bootTimeout: 2m0s
    - inline: |
        apiVersion: v1alpha1
        kind: ResolverConfig
        nameservers:
          - address: 1.1.1.1
          - address: 8.8.8.8
---
apiVersion: os.pk.io/v1alpha1
kind: TalosNode
metadata:
  name: node-1
  # lab.sh applies this as lab-admin: the requester (metal.pk.io/requested-by).
  annotations:
    metal.pk.io/requested-by: lab-admin
spec:
  clusterRef:
    name: lab
  role: controlplane
  # The disk Talos installs onto; it is repartitioned and overwritten.
  installDiskSelector:
    serial: pklab-disk-1
  network:
    links:
      - name: lan
        hardwareAddr: "52:54:00:77:00:11"
        addresses:
          - 10.77.0.11/24
        routes:
          - gateway: 10.77.0.1
