# The workload cluster the lab installs: one control plane and two workers on
# the lab bridge, the Kubernetes API on a virtual IP the control plane holds.
#
#   node-1  10.77.0.11  control plane   (VIP 10.77.0.10)
#   node-2  10.77.0.12  worker
#   node-3  10.77.0.13  worker
#
# Links and install disks are selected by what lab/fleet.yaml gives each machine
# (NIC MAC, disk serial), never by a device name that depends on probe order.
# The gateway is the workstation's end of the bridge, which NATs.
#
# The secrets bundle is not here and the operator never makes one. `mise run
# lab:up` generates it once on the workstation with `talosctl gen secrets` and
# creates the Secret the cluster names below (key secrets.yaml).
#
# The TalosCluster holds what every node shares (think group_vars, or the
# %include part of a kickstart); each TalosNode holds what is per machine
# (address, install disk, role). The operator renders one Talos machine
# configuration per node from the two. Change a value here and apply it again
# (mise run lab:apply); the operator renders anew. A machine that is already
# installed does not pick the change up by itself: push it with talosctl
# (talosctl -n <address> patch machineconfig --patch @change.yaml).
apiVersion: os.pk.io/v1alpha1
kind: TalosCluster
metadata:
  name: lab
  annotations:
    metal.pk.io/requested-by: lab-admin
spec:
  talosVersion: v1.14.6
  kubernetesVersion: v1.36.2
  endpoint: https://10.77.0.10:6443
  controlPlane:
    vip: 10.77.0.10
  network:
    cni:
      name: flannel
  secretsRef:
    namespace: pk-metal
    name: lab-talos-secrets
  schematic:
    customization:
      extraKernelArgs:
        # The simulated BMC records the machine's serial console; without this
        # the boot is invisible in .lab/state/<machine>/console.log. On real
        # hardware, name the port your BMC's serial-over-LAN redirects, for
        # example console=ttyS1,115200n8 on many Supermicro boards.
        - console=ttyS0
  # Talos machine configuration documents, merged into every node's
  # configuration. The operator adds nothing here on its own.
  patches:
    # Talos holds the boot until the clock is synchronized, forever by default.
    # A lab machine's clock comes from the workstation and is right from the
    # first second, while NTP may not be reachable at all (a CI runner, a
    # laptop behind a captive portal). Two minutes, then carry on.
    - inline: |
        apiVersion: v1alpha1
        kind: TimeSyncConfig
        bootTimeout: 2m0s
    # The DNS servers the machines use. These two are Talos' own defaults,
    # written out so that they are easy to find: a site that blocks public
    # resolvers puts its own here. The machines reach them through the
    # workstation's NAT. A site proxy goes into a second document in the
    # same way, see "Behind a proxy" in lab/README.md.
    - inline: |
        apiVersion: v1alpha1
        kind: ResolverConfig
        nameservers:
          - address: 1.1.1.1
          - address: 8.8.8.8
---
apiVersion: os.pk.io/v1alpha1
kind: TalosNode
metadata:
  name: node-1
  annotations:
    metal.pk.io/requested-by: lab-admin
spec:
  clusterRef:
    name: lab
  # The node's role in the cluster. The operator renders the Talos config from
  # it. (The claim's labels.role in 30-claims.yaml selects BIOS and firmware
  # profiles instead; keep the two in step by hand.)
  role: controlplane
  # The disk Talos installs onto. The first disk that matches is repartitioned
  # and overwritten. A serial (or wwid) names exactly one disk; a model or
  # size pattern can match a data disk too.
  installDiskSelector:
    serial: pklab-disk-1
  network:
    links:
      - name: lan
        hardwareAddr: "52:54:00:77:00:11"
        addresses:
          - 10.77.0.11/24
        routes:
          - gateway: 10.77.0.1
---
apiVersion: os.pk.io/v1alpha1
kind: TalosNode
metadata:
  name: node-2
  annotations:
    metal.pk.io/requested-by: lab-admin
spec:
  clusterRef:
    name: lab
  role: worker
  installDiskSelector:
    serial: pklab-disk-2
  network:
    links:
      - name: lan
        hardwareAddr: "52:54:00:77:00:12"
        addresses:
          - 10.77.0.12/24
        routes:
          - gateway: 10.77.0.1
---
apiVersion: os.pk.io/v1alpha1
kind: TalosNode
metadata:
  name: node-3
  annotations:
    metal.pk.io/requested-by: lab-admin
spec:
  clusterRef:
    name: lab
  role: worker
  installDiskSelector:
    serial: pklab-disk-3
  network:
    links:
      - name: lan
        hardwareAddr: "52:54:00:77:00:13"
        addresses:
          - 10.77.0.13/24
        routes:
          - gateway: 10.77.0.1
