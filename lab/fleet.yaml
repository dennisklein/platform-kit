# The machines of the virtual lab, as `pk-metal sim fleet --config` serves them:
# one simulated BMC per entry, each driving one QEMU machine.
#
# Everything else in the lab is derived from this file or has to agree with it:
#   - lab/net.sh creates one tap per qemu.tap,
#   - the operator's ledger is bmcMAC -> https://<listen>,
#   - lab/manifests names the same serials, BMC MACs, NIC MACs and disk serials.
# All values are synthetic. The MACs are locally administered, the addresses are
# the lab bridge's, and the credentials open nothing but a simulator.
#
# Relative paths are relative to the repository root.
stateDir: .lab/state # per machine: disk, UEFI variables, console log
mediaCache: .lab/cache # downloaded installer images, kept across lab:down
machines:
  # The control plane. Talos wants 2 GiB there at the very least; with 4 it
  # also runs the workload cluster's own control-plane pods comfortably.
  - name: node-1
    listen: 10.77.0.1:8441
    personality: generic # generic | supermicro-x12 | huawei-2288h-v5
    credentials: { username: admin, password: admin-pass }
    identity:
      serial: PKLAB0001
      uuid: 9b1c0001-0000-4000-8000-000000000001
      bmcMAC: "02:77:00:00:01:01"
      nicMACs: ["52:54:00:77:00:11"]
    backend: qemu # none | qemu | docker
    qemu: { tap: pktap1, memoryMiB: 4096, cpus: 2, diskGiB: 20, diskSerial: pklab-disk-1 }

  # Two workers. Sized so that the three machines and the kind node fit a
  # 16 GiB workstation or CI runner.
  - name: node-2
    listen: 10.77.0.1:8442
    personality: generic
    credentials: { username: admin, password: admin-pass }
    identity:
      serial: PKLAB0002
      uuid: 9b1c0002-0000-4000-8000-000000000002
      bmcMAC: "02:77:00:00:01:02"
      nicMACs: ["52:54:00:77:00:12"]
    backend: qemu
    qemu: { tap: pktap2, memoryMiB: 2048, cpus: 2, diskGiB: 20, diskSerial: pklab-disk-2 }

  # node-3 speaks the Supermicro X12 dialect (OEM board serial, three
  # virtual media slots, a UsbCd boot target), so a vendor other than the
  # generic one goes through the whole path. A Huawei iBMC holds one medium
  # only, and a blank lab machine has no maintenance-mode Talos to boot into,
  # so that personality would hold the install by design.
  - name: node-3
    listen: 10.77.0.1:8443
    personality: supermicro-x12
    credentials: { username: admin, password: admin-pass }
    identity:
      serial: PKLAB0003
      uuid: 9b1c0003-0000-4000-8000-000000000003
      bmcMAC: "02:77:00:00:01:03"
      nicMACs: ["52:54:00:77:00:13"]
    backend: qemu
    qemu: { tap: pktap3, memoryMiB: 2048, cpus: 2, diskGiB: 20, diskSerial: pklab-disk-3 }
