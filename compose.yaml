# platform-kit demo: forge (Gitea), forge-init (users, tokens, seed repo),
# bench (UI, API, MCP), ci (pk/policy status) and fluxsim (simulated Flux).
#
#   docker compose up -d          then open http://127.0.0.1:8080
#   docker compose up -d --build  after a git pull (the image is not rebuilt otherwise)
#
# Ports bind to 127.0.0.1 only: bench 8080, Gitea 3000, fluxsim 8081. Change
# them with PK_BENCH_PORT, PK_FORGE_PORT, PK_FLUX_PORT (shell or .env file).
# LLM: PK_LLM_BASE_URL (OpenAI compatible, for example
# http://host.docker.internal:11434/v1 for Ollama on this machine),
# PK_LLM_MODEL, PK_LLM_API_KEY, PK_LLM_EMBED_MODEL, PK_LLM_TIMEOUT (one
# model call, Go duration, default 45s). Unset: mock model.
# Times: PK_TZ (default Europe/Berlin).
# Rehearsal reset: docker compose run --rm forge-init forge-init --reset
# Demo logins in Gitea: dennis, anna, jonas, mara, vera / pk-demo-2026.

name: platform-kit

# Built from this checkout on the first `up` (never pulled). After a git pull
# use `docker compose up -d --build`.
x-pk-image: &pk-image
  image: ${PK_IMAGE:-platform-kit:dev}
  pull_policy: never
  build:
    context: .

# TZ: times the containers print (pk agents approve, ring holds) use this
# zone. Set PK_TZ to yours (default Europe/Berlin; the image has tzdata).
x-forge-env: &forge-env
  TZ: ${PK_TZ:-Europe/Berlin}
  PK_FORGE_URL: http://gitea:3000
  PK_FORGE_CREDENTIALS: /creds/forge.json
  PK_FORGE_OWNER: platform
  PK_FORGE_REPO: state

services:
  gitea:
    image: gitea/gitea:1.24
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://127.0.0.1:${PK_FORGE_PORT:-3000}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
      GITEA__actions__ENABLED: "false"
      GITEA__mailer__ENABLED: "false"
      # Fatal: Gitea logs "[E] ... already in queue" for each seeded pull
      # request on a first start and a reset. They are harmless, but they look
      # like failures in an attached terminal. The demo does not need Gitea logs.
      GITEA__log__LEVEL: Fatal
    ports:
      - "127.0.0.1:${PK_FORGE_PORT:-3000}:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Gitea has no API to make the first admin; use its CLI on the same volume.
  forge-admin:
    image: gitea/gitea:1.24
    restart: "no"
    user: "1000:1000"
    environment:
      GITEA_WORK_DIR: /data/gitea
      PK_FORGE_ADMIN_USER: ${PK_FORGE_ADMIN_USER:-pk-admin}
      PK_FORGE_ADMIN_PASSWORD: ${PK_FORGE_ADMIN_PASSWORD:-pk-admin-demo}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        gitea --config /data/gitea/conf/app.ini admin user list --admin | grep -qw "$$PK_FORGE_ADMIN_USER" ||
        gitea --config /data/gitea/conf/app.ini admin user create --admin
        --username "$$PK_FORGE_ADMIN_USER" --password "$$PK_FORGE_ADMIN_PASSWORD"
        --email "$$PK_FORGE_ADMIN_USER@pk.local" --must-change-password=false
    volumes:
      - gitea-data:/data
    depends_on:
      gitea:
        condition: service_healthy

  forge-init:
    <<: *pk-image
    restart: "no"
    command: ["forge-init"]
    environment:
      <<: *forge-env
      PK_FORGE_PUBLIC_URL: http://gitea:3000
      PK_FORGE_ADMIN_USER: ${PK_FORGE_ADMIN_USER:-pk-admin}
      PK_FORGE_ADMIN_PASSWORD: ${PK_FORGE_ADMIN_PASSWORD:-pk-admin-demo}
    volumes:
      - creds:/creds
      - forge-init-data:/data
    depends_on:
      gitea:
        condition: service_healthy
      forge-admin:
        condition: service_completed_successfully

  bench:
    <<: *pk-image
    restart: unless-stopped
    command: ["bench"]
    environment:
      <<: *forge-env
      PK_DEMO: "1"
      PK_USER: dennis
      PK_ADDR: 0.0.0.0:8080
      PK_DATA: /data
      PK_ALLOWED_HOSTS: bench:8080,127.0.0.1:${PK_BENCH_PORT:-8080},localhost:${PK_BENCH_PORT:-8080}
      PK_PUBLIC_URL: http://127.0.0.1:${PK_BENCH_PORT:-8080}
      PK_FLUX_URL: http://fluxsim:8081
      PK_ADMIN_TOKEN: ${PK_ADMIN_TOKEN:-}
      PK_LLM_BASE_URL: ${PK_LLM_BASE_URL:-}
      PK_LLM_MODEL: ${PK_LLM_MODEL:-}
      PK_LLM_API_KEY: ${PK_LLM_API_KEY:-}
      PK_LLM_EMBED_MODEL: ${PK_LLM_EMBED_MODEL:-}
      PK_LLM_TIMEOUT: ${PK_LLM_TIMEOUT:-}
      PK_LAB_SPEED: ${PK_LAB_SPEED:-1}
    ports:
      - "127.0.0.1:${PK_BENCH_PORT:-8080}:8080"
    volumes:
      - bench-data:/data
      - creds:/creds:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      forge-init:
        condition: service_completed_successfully
      fluxsim:
        condition: service_started

  ci:
    <<: *pk-image
    restart: unless-stopped
    command: ["ci"]
    environment:
      <<: *forge-env
      PK_DATA: /data
      PK_POLL_INTERVAL: 3s
    volumes:
      - ci-data:/data
      - creds:/creds:ro
    depends_on:
      forge-init:
        condition: service_completed_successfully

  fluxsim:
    <<: *pk-image
    restart: unless-stopped
    command: ["fluxsim"]
    environment:
      <<: *forge-env
      PK_DATA: /data
      PK_FLUX_ADDR: 0.0.0.0:8081
    ports:
      - "127.0.0.1:${PK_FLUX_PORT:-8081}:8081"
    volumes:
      - fluxsim-data:/data
      - creds:/creds:ro
    depends_on:
      forge-init:
        condition: service_completed_successfully

volumes:
  gitea-data:
  creds:
  forge-init-data:
  bench-data:
  ci-data:
  fluxsim-data:
